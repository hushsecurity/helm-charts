---
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-helm
    schedule:
      interval: weekly
    commit-message:
      prefix: "HUSH-777 "
  - package-ecosystem: "pip"
    directories:
      - "/cli"
      - "/tests"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "HUSH-777 "
