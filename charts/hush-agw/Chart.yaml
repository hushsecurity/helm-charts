apiVersion: v2
name: hush-agw
description: A Helm chart for the Hush Security Agent Gateway.
type: application
version: 0.8.0
appVersion: "v0.10.0"
home: https://hush.security
dependencies:
  - name: hush-common
    version: 0.1.0
    repository: "file://./charts/hush-common"
annotations:
  # The credential helpers in hush-common fall back to a sensor release's
  # deployment Secret (hushDeployment.sensorDeploymentSecretName).
  hush.security/sensor-deployment-secret-fallback: "true"
