# AWS Application Load Balancer set up by hand, through the Ingress's
# annotations. It needs the AWS Load Balancer Controller in the cluster, the
# ACM certificate below, and subnets tagged kubernetes.io/role/elb in at least
# two Availability Zones: an ALB needs two, and the controller picks one tagged
# subnet per zone. Point the hostname's DNS record at the ALB once it has an
# address.
#
# Sticky sessions keep a client on the Hush AGW pod that served it before, for
# clients that send back the cookie the ALB sets.
agw:
  hostname: gw.example.com
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/healthcheck-port: "15021"
      alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
hushDeployment:
  token: dummy-token
  password: dummy-password
