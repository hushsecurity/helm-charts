# Azure Application Gateway for Containers set up by hand, through the
# Ingress's annotations, where the 'agw.ingress.controller: azure-agc' preset
# would create the objects they name. It needs the ALB Controller in the
# cluster and its ApplicationLoadBalancer alb-infra/alb. Create these two in
# the release's namespace before installing, for a release named hush-agw,
# whose Service they name:
#
#   apiVersion: alb.networking.azure.io/v1
#   kind: HealthCheckPolicy
#   metadata:
#     name: hush-agw
#   spec:
#     targetRef:
#       group: ""
#       kind: Service
#       name: hush-agw
#     default:
#       port: 15021
#       http:
#         path: /healthz/ready
#   ---
#   apiVersion: alb.networking.azure.io/v1
#   kind: IngressExtension
#   metadata:
#     name: hush-agw
#   spec:
#     backendSettings:
#       - service: hush-agw
#         timeouts:
#           requestTimeout: 1800s
#         sessionAffinity:
#           affinityType: managed-cookie
#
# The HealthCheckPolicy health checks Hush AGW. The IngressExtension lets a
# request, an MCP stream included, last 30 minutes, and keeps a client on the
# Hush AGW pod that served it before, for clients that send back the cookie AGC
# sets. cert-manager, with a ClusterIssuer named letsencrypt, issues the
# certificate into the Secret below and renews it. The Ingress names its
# frontend, since the ALB Controller otherwise gives cert-manager's HTTP-01
# solver a frontend of its own, which the challenge does not reach. The
# ClusterIssuer's HTTP-01 solver must name the same frontend in the
# alb.networking.azure.io/alb-frontend annotation of its ingressTemplate. Point
# the hostname's DNS record at the frontend once it has an address.
agw:
  hostname: gw.example.com
  ingress:
    enabled: true
    className: azure-alb-external
    annotations:
      alb.networking.azure.io/alb-name: alb
      alb.networking.azure.io/alb-namespace: alb-infra
      alb.networking.azure.io/alb-frontend: hush-agw
      alb.networking.azure.io/alb-ingress-extension: hush-agw
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      secretName: gw-example-com-tls
hushDeployment:
  token: dummy-token
  password: dummy-password
