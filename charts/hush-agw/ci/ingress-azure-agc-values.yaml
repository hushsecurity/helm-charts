# Azure Application Gateway for Containers through
# 'agw.ingress.controller: azure-agc', which also creates the
# HealthCheckPolicy and the IngressExtension. It needs the ALB Controller in
# the cluster and its ApplicationLoadBalancer alb-infra/alb. cert-manager, with
# a ClusterIssuer named letsencrypt, issues the certificate into the Secret and
# renews it. The Ingress names its frontend, since the ALB Controller otherwise
# gives cert-manager's HTTP-01 solver a frontend of its own, which the challenge
# does not reach. The ClusterIssuer's HTTP-01 solver must name the same frontend
# in the alb.networking.azure.io/alb-frontend annotation of its ingressTemplate.
# Point the hostname's DNS record at the frontend once it has an address.
agw:
  hostname: gw.example.com
  ingress:
    enabled: true
    controller: azure-agc
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      alb.networking.azure.io/alb-frontend: hush-agw
    tls:
      secretName: gw-example-com-tls
    azureAgc:
      albName: alb
      albNamespace: alb-infra
hushDeployment:
  token: dummy-token
  password: dummy-password
