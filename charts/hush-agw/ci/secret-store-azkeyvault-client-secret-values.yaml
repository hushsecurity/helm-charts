agw:
  hostname: gw.example.com
  secretStore:
    kind: "az_key_vault"
    azKeyVault:
      vaultUrl: "https://acme-prod.vault.azure.net"
      # the settings that are omitted when empty
      cloud: "usgov"
      timeout: "45s"
      auth:
        method: "client_secret"
        tenantId: "8ea310af-fd38-43b1-8ff6-17df102dc19a"
        clientId: "35e9cbbc-45ee-4ec6-8500-3799c3ffbc8e"
        # the only branch that emits a valueFrom rather than a value
        clientSecretRef:
          name: "azure-sp"
          key: "client-secret"
hushDeployment:
  token: dummy-token
  password: dummy-password
