agw:
  hostname: gw.example.com
  secretStore:
    kind: "hc_vault"
    # a KV v2 path, three '/'-separated segments
    prefix: "acme/prod/eu"
    hcVault:
      address: "https://vault.example.com:8200"
      mount: "hush-kv"
      auth:
        method: "kubernetes"
        role: "hush-agw"
        audience: "vault"
hushDeployment:
  token: dummy-token
  password: dummy-password
