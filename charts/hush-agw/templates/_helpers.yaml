{{- define "hush-agw.hostname" -}}
{{- $host := required "'agw.hostname' is required" .Values.agw.hostname -}}
{{- if ne $host (lower $host) -}}
  {{- fail "'agw.hostname' must be lowercase" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$" $host) -}}
  {{- fail "'agw.hostname' must be a bare domain name, without a scheme, port or path" -}}
{{- end -}}
{{- $host -}}
{{- end }}

{{- define "hush-agw.readinessPort" -}}
15021
{{- end }}

{{- define "hush-agw.readinessPath" -}}
/healthz/ready
{{- end }}

{{- define "hush-agw.servicePort" -}}
{{- ternary 443 3001 (eq (include "hush-agw.serviceType" .) "LoadBalancer") -}}
{{- end }}

{{/*
External base URL clients reach Hush AGW on, built from the hostname.
*/}}
{{- define "hush-agw.baseUrl" -}}
https://{{ include "hush-agw.hostname" . }}
{{- end }}

{{- define "hush-agw.serviceType" -}}
{{- $type := toString .Values.agw.service.type -}}
{{- if not (has $type (list "ClusterIP" "LoadBalancer")) -}}
  {{- fail "'agw.service.type' must be ClusterIP or LoadBalancer" -}}
{{- end -}}
{{- if include "hush-agw.serviceLoadBalancer" . -}}
  {{- $type = "LoadBalancer" -}}
{{- end -}}
{{- $type -}}
{{- end }}

{{/*
Image path for the agw-controller container.
*/}}
{{- define "hush-agw.controllerImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.controllerRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-agentgateway container.
*/}}
{{- define "hush-agw.agentgatewayImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.agentgatewayRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-vector container.
*/}}
{{- define "hush-agw.vectorImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.vectorRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-genai-toolbox container.
*/}}
{{- define "hush-agw.genaiToolboxImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.genaiToolboxRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Persistent volume claim name for the data of Hush AGW.
*/}}
{{- define "hush-agw.dataClaimName" -}}
{{- if .Values.agw.persistence.existingClaim -}}
  {{- .Values.agw.persistence.existingClaim -}}
{{- else -}}
  {{- printf "%s-data" (include "hush-common.fullName" .) -}}
{{- end -}}
{{- end }}

{{- define "hush-agw.checkDataVolumeStorage" -}}
{{- $size := dig "dataVolume" "size" "1Gi" .Values.agw -}}
{{- $sizeBytes := float64 (include "hush-common.quantityBytes" (dict "key" "agw.dataVolume.size" "value" $size)) -}}
{{- $controller := .Values.agw.controller.resources | default dict -}}
{{- $request := dig "requests" "ephemeral-storage" (dig "limits" "ephemeral-storage" "0" $controller) $controller -}}
{{- $requestBytes := float64 (include "hush-common.quantityBytes" (dict "key" "agw.controller.resources.requests.ephemeral-storage" "value" $request)) -}}
{{- if lt $requestBytes $sizeBytes -}}
  {{- fail (printf "'agw.controller.resources.requests.ephemeral-storage' must be at least 'agw.dataVolume.size' (%v), to reserve the node's disk the data volume takes" $size) -}}
{{- end -}}
{{- $limited := false -}}
{{- $limitsBytes := 0.0 -}}
{{- range $name := list "controller" "agentgateway" "vector" "genaiToolbox" -}}
  {{- with dig $name "resources" "limits" "ephemeral-storage" "" $.Values.agw -}}
    {{- $limited = true -}}
    {{- $limitsBytes = addf $limitsBytes (include "hush-common.quantityBytes" (dict "key" (printf "agw.%s.resources.limits.ephemeral-storage" $name) "value" .)) -}}
  {{- end -}}
{{- end -}}
{{- if and $limited (le $limitsBytes $sizeBytes) -}}
  {{- fail (printf "the ephemeral-storage limits of 'agw.controller', 'agw.agentgateway', 'agw.vector' and 'agw.genaiToolbox' must add up to more than 'agw.dataVolume.size' (%v), or the pod is evicted before its data volume is full" $size) -}}
{{- end -}}
{{- end }}

{{- define "hush-agw.dataVolume" -}}
{{- $type := toString (dig "dataVolume" "type" "emptyDir" .Values.agw) -}}
{{- $size := dig "dataVolume" "size" "1Gi" .Values.agw -}}
{{- if eq $type "emptyDir" -}}
{{- include "hush-agw.checkDataVolumeStorage" . -}}
emptyDir:
  sizeLimit: {{ $size }}
{{- else if eq $type "ephemeral" -}}
ephemeral:
  volumeClaimTemplate:
    metadata:
      labels: {{- include "hush-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-data-volume-claim
    spec:
      accessModes:
        - ReadWriteOnce
      {{- with (dig "dataVolume" "storageClassName" "" .Values.agw) }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ $size }}
{{- else -}}
  {{- fail "'agw.dataVolume.type' must be emptyDir or ephemeral" -}}
{{- end -}}
{{- end }}

{{- define "hush-agw.secretNamespaces" -}}
{{- $namespaces := list (include "hush-common.namespace" .) -}}
{{- if eq (toString .Values.agw.secretStore.kind) "kubesecrets" -}}
  {{- $namespaces = append $namespaces (include "hush-common.kubeSiloNamespace" (dict "store" .Values.agw.secretStore "path" "agw.secretStore" "root" .)) -}}
{{- end -}}
{{- $namespaces = concat $namespaces (dig "k8s" "additionalNamespaces" (list) .Values.agw.secretStore) -}}
{{- $namespaces | uniq | join " " -}}
{{- end }}

{{/*
Shared environment for the agw-controller (init + server).
*/}}
{{- define "hush-agw.controllerEnv" -}}
{{ include "hush-common.deploymentIdentityEnv" . }}
- name: ADDR
  value: ":8080"
- name: XDS_ADDR
  value: ":18000"
- name: BASE_URL
  value: {{ include "hush-agw.baseUrl" . | quote }}
- name: INTERNAL_BASE_URL
  value: "http://localhost:8080"
- name: DB_DIR
  value: /data
- name: HUSH_K8S_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
- name: DYNAMIC_OAUTH_REGISTRATION_TTL
  value: {{ .Values.agw.dynamicOAuthRegistrationTTL | quote }}
- name: TOOLBOX_CONFIG_PATH
  value: /etc/toolbox/tools.yaml
- name: TOOLBOX_URL
  value: http://localhost:5000
{{ include "hush-common.siloEnvs" (dict "store" .Values.agw.secretStore "path" "agw.secretStore" "root" . "azureClientIdPath" "agw.workloadIdentity.azure.clientId") }}
{{- with (include "hush-common.awsWebIdentityEnvs" (include "hush-agw.workloadIdentityContext" . | fromYaml)) }}
{{ . }}
{{- end }}
{{- end }}

{{/*
Environment for the agw-vector container.
*/}}
{{- define "hush-agw.vectorEnv" -}}
{{ include "hush-common.deploymentIdentityEnv" . }}
- name: TOKENGEN_SKIP_ON_NO_CONFIG
  value: "1"
- name: HELM_RELEASE
  value: {{ .Release.Name }}
- name: HELM_NAMESPACE
  value: {{ include "hush-common.namespace" . }}
- name: HELM_CHART_VERSION
  value: {{ .Chart.Version | quote }}
{{- end }}

{{/*
The workload identity of Hush AGW, in the context the hush-common helpers take
*/}}
{{- define "hush-agw.workloadIdentityContext" -}}
{{- include "hush-common.workloadIdentityContext" (dict
    "identity" .Values.agw.workloadIdentity
    "path" "agw.workloadIdentity"
    "secretStore" (dict "store" .Values.agw.secretStore "path" "agw.secretStore")) -}}
{{- end }}

{{/*
Annotations of the Hush AGW service account
*/}}
{{- define "hush-agw.serviceAccountAnnotations" -}}
{{- $identity := include "hush-common.workloadIdentityServiceAccountAnnotations" (include "hush-agw.workloadIdentityContext" . | fromYaml) | fromYaml -}}
{{- $annotations := merge (deepCopy (.Values.agw.serviceAccount.annotations | default dict)) $identity -}}
{{- with $annotations -}}
{{ toYaml . }}
{{- end -}}
{{- end }}

{{/*
Annotations of the Hush AGW pod. With irsa or an Azure client id, the EKS or
the Azure webhook hands the identity to the containers that reach the secret
store only.
*/}}
{{- define "hush-agw.podAnnotations" -}}
{{- $identity := dict -}}
{{- $skipped := list "agw-agentgateway" "agw-vector" "agw-genai-toolbox" -}}
{{- if .Values.agw.workloadIdentity.aws.irsa -}}
  {{- $_ := set $identity "eks.amazonaws.com/skip-containers" (join "," $skipped) -}}
{{- end -}}
{{- if .Values.agw.workloadIdentity.azure.clientId -}}
  {{- $_ := set $identity "azure.workload.identity/skip-containers" (join ";" $skipped) -}}
{{- end -}}
{{- $annotations := merge (deepCopy (.Values.agw.annotations | default dict)) $identity -}}
{{- with $annotations -}}
{{ toYaml . }}
{{- end -}}
{{- end }}

{{- define "hush-agw.serviceLoadBalancer" -}}
{{- $loadBalancer := toString .Values.agw.service.loadBalancer -}}
{{- $known := list "aws-nlb" -}}
{{- if and $loadBalancer (not (has $loadBalancer $known)) -}}
  {{- fail (printf "'agw.service.loadBalancer' must be empty or one of: %s" (join ", " $known)) -}}
{{- end -}}
{{- $loadBalancer -}}
{{- end }}

{{- define "hush-agw.serviceAnnotations" -}}
{{- $preset := dict -}}
{{- if eq (include "hush-agw.serviceLoadBalancer" .) "aws-nlb" -}}
  {{- $nlb := .Values.agw.service.awsNlb -}}
  {{- $prefix := "service.beta.kubernetes.io/aws-load-balancer-" -}}
  {{- $_ := set $preset (print $prefix "type") "external" -}}
  {{- $_ = set $preset (print $prefix "nlb-target-type") "ip" -}}
  {{- $_ = set $preset (print $prefix "scheme") $nlb.scheme -}}
  {{- $_ = set $preset (print $prefix "ssl-cert") (required "'agw.service.awsNlb.certificateArn' is required" $nlb.certificateArn) -}}
  {{- $_ = set $preset (print $prefix "ssl-ports") "443" -}}
  {{- with $nlb.sslPolicy -}}
    {{- $_ = set $preset (print $prefix "ssl-negotiation-policy") . -}}
  {{- end -}}
  {{- $_ = set $preset (print $prefix "healthcheck-protocol") "http" -}}
  {{- $_ = set $preset (print $prefix "healthcheck-port") (include "hush-agw.readinessPort" .) -}}
  {{- $_ = set $preset (print $prefix "healthcheck-path") (include "hush-agw.readinessPath" .) -}}
  {{- $_ = set $preset (print $prefix "attributes") (printf "load_balancing.cross_zone.enabled=%v" $nlb.crossZone) -}}
{{- end -}}
{{- if and .Values.agw.ingress.enabled (eq (include "hush-agw.ingressController" .) "gke-ingress") -}}
  {{- $_ := set $preset "cloud.google.com/neg" (toJson (dict "ingress" true)) -}}
  {{- if .Values.agw.ingress.gkeIngress.backendConfig.enabled -}}
    {{- $_ = set $preset "cloud.google.com/backend-config" (toJson (dict "default" (include "hush-common.fullName" .))) -}}
  {{- end -}}
{{- end -}}
{{- $annotations := merge (deepCopy (.Values.agw.service.annotations | default dict)) $preset -}}
{{- with $annotations -}}
  {{ toYaml . }}
{{- end -}}
{{- end }}

{{- define "hush-agw.ingressController" -}}
{{- $controller := toString .Values.agw.ingress.controller -}}
{{- $known := list "aws-alb" "gke-ingress" "azure-agc" -}}
{{- if and $controller (not (has $controller $known)) -}}
  {{- fail (printf "'agw.ingress.controller' must be empty or one of: %s" (join ", " $known)) -}}
{{- end -}}
{{- $controller -}}
{{- end }}

{{- define "hush-agw.ingressClassName" -}}
{{- $controller := include "hush-agw.ingressController" . -}}
{{- if and .Values.agw.ingress.className (eq $controller "gke-ingress") -}}
  {{- fail "'agw.ingress.className' cannot be used with gke-ingress, which takes the class from the 'kubernetes.io/ingress.class' annotation" -}}
{{- else if and .Values.agw.ingress.className (eq $controller "azure-agc") -}}
  {{- fail "'agw.ingress.className' cannot be used with azure-agc, since the ALB Controller serves only Ingresses of the class azure-alb-external" -}}
{{- else if .Values.agw.ingress.className -}}
  {{- .Values.agw.ingress.className -}}
{{- else if eq $controller "aws-alb" -}}
  alb
{{- else if eq $controller "azure-agc" -}}
  azure-alb-external
{{- end -}}
{{- end }}

{{- define "hush-agw.ingressAnnotations" -}}
{{- $controller := include "hush-agw.ingressController" . -}}
{{- $preset := dict -}}
{{- if eq $controller "aws-alb" -}}
  {{- $alb := .Values.agw.ingress.awsAlb -}}
  {{- if and $alb.stickiness.enabled (not $alb.crossZone) -}}
    {{- fail "'agw.ingress.awsAlb.stickiness.enabled' cannot be used with 'crossZone: false', which AWS refuses on an ALB target group" -}}
  {{- end -}}
  {{- $prefix := "alb.ingress.kubernetes.io/" -}}
  {{- $_ := set $preset (print $prefix "scheme") $alb.scheme -}}
  {{- $_ = set $preset (print $prefix "target-type") "ip" -}}
  {{- $_ = set $preset (print $prefix "listen-ports") (toJson (list (dict "HTTPS" 443))) -}}
  {{- with $alb.certificateArn -}}
    {{- $_ = set $preset (print $prefix "certificate-arn") . -}}
  {{- end -}}
  {{- $_ = set $preset (print $prefix "healthcheck-port") (include "hush-agw.readinessPort" .) -}}
  {{- $_ = set $preset (print $prefix "healthcheck-path") (include "hush-agw.readinessPath" .) -}}
  {{- $_ = set $preset (print $prefix "load-balancer-attributes") (printf "idle_timeout.timeout_seconds=%d" (int $alb.idleTimeout)) -}}
  {{- with $alb.sslPolicy -}}
    {{- $_ = set $preset (print $prefix "ssl-policy") . -}}
  {{- end -}}
  {{- $_ = set $preset (print $prefix "target-group-attributes") (printf "stickiness.enabled=%v,stickiness.lb_cookie.duration_seconds=%d,load_balancing.cross_zone.enabled=%v" $alb.stickiness.enabled (int $alb.stickiness.duration) $alb.crossZone) -}}
{{- else if eq $controller "gke-ingress" -}}
  {{- $gke := .Values.agw.ingress.gkeIngress -}}
  {{- $_ := set $preset "kubernetes.io/ingress.class" "gce" -}}
  {{- if $gke.managedCertificate.enabled -}}
    {{- $_ = set $preset "networking.gke.io/managed-certificates" (include "hush-common.fullName" .) -}}
  {{- end -}}
  {{- if $gke.frontendConfig.enabled -}}
    {{- $_ = set $preset "networking.gke.io/v1beta1.FrontendConfig" (include "hush-common.fullName" .) -}}
  {{- end -}}
{{- else if eq $controller "azure-agc" -}}
  {{- $agc := .Values.agw.ingress.azureAgc -}}
  {{- $prefix := "alb.networking.azure.io/" -}}
  {{- $_ := required "'agw.ingress.tls.secretName' is required for 'agw.ingress.controller: azure-agc'" .Values.agw.ingress.tls.secretName -}}
  {{- if $agc.albId -}}
    {{- $_ = set $preset (print $prefix "alb-id") $agc.albId -}}
    {{- $_ = set $preset (print $prefix "alb-frontend") (required "'agw.ingress.azureAgc.albFrontend' is required with 'albId'" $agc.albFrontend) -}}
  {{- else if $agc.albName -}}
    {{- $_ = set $preset (print $prefix "alb-name") $agc.albName -}}
    {{- $_ = set $preset (print $prefix "alb-namespace") (required "'agw.ingress.azureAgc.albNamespace' is required with 'albName'" $agc.albNamespace) -}}
  {{- else -}}
    {{- fail "'agw.ingress.azureAgc.albName' and 'albNamespace', or 'albId' and 'albFrontend', are required" -}}
  {{- end -}}
  {{- if $agc.ingressExtension.enabled -}}
    {{- $_ = set $preset (print $prefix "alb-ingress-extension") (include "hush-common.fullName" .) -}}
  {{- end -}}
{{- end -}}
{{- $annotations := merge (deepCopy (.Values.agw.ingress.annotations | default dict)) $preset -}}
{{- with $annotations -}}
  {{ toYaml . }}
{{- end -}}
{{- end }}

{{- define "hush-agw.httpRouteParentRefs" -}}
{{- $route := .Values.agw.httpRoute -}}
{{- if $route.gateway.enabled -}}
  {{- toYaml (list (dict "name" (include "hush-common.fullName" .) "sectionName" "https")) -}}
{{- else if $route.parentRefs -}}
  {{- toYaml $route.parentRefs -}}
{{- else -}}
  {{- fail "'agw.httpRoute.parentRefs' or 'agw.httpRoute.gateway.enabled' is required" -}}
{{- end -}}
{{- end }}

{{- define "hush-agw.httpRouteController" -}}
{{- $controller := toString .Values.agw.httpRoute.controller -}}
{{- $known := list "aws-alb" "gke-gateway" "azure-agc" -}}
{{- if and $controller (not (has $controller $known)) -}}
  {{- fail (printf "'agw.httpRoute.controller' must be empty or one of: %s" (join ", " $known)) -}}
{{- end -}}
{{- $controller -}}
{{- end }}

{{- define "hush-agw.gatewayInfrastructure" -}}
{{- $controller := include "hush-agw.httpRouteController" . -}}
{{- if and (eq $controller "aws-alb") .Values.agw.httpRoute.awsAlb.loadBalancerConfiguration.enabled -}}
parametersRef:
  group: gateway.k8s.aws
  kind: LoadBalancerConfiguration
  name: {{ include "hush-common.fullName" . }}
{{- end -}}
{{- end }}

{{- define "hush-agw.gatewayClassName" -}}
{{- $controller := include "hush-agw.httpRouteController" . -}}
{{- if .Values.agw.httpRoute.gateway.className -}}
  {{- .Values.agw.httpRoute.gateway.className -}}
{{- else if eq $controller "gke-gateway" -}}
  gke-l7-global-external-managed
{{- else if eq $controller "azure-agc" -}}
  azure-alb-external
{{- else -}}
  {{- fail "'agw.httpRoute.gateway.className' is required" -}}
{{- end -}}
{{- end }}

{{- define "hush-agw.gatewayAnnotations" -}}
{{- $route := .Values.agw.httpRoute -}}
{{- $controller := include "hush-agw.httpRouteController" . -}}
{{- $preset := dict -}}
{{- if eq $controller "gke-gateway" -}}
  {{- with $route.gkeGateway.certificateMap -}}
    {{- $_ := set $preset "networking.gke.io/certmap" . -}}
  {{- end -}}
{{- else if eq $controller "azure-agc" -}}
  {{- $agc := $route.azureAgc -}}
  {{- $prefix := "alb.networking.azure.io/" -}}
  {{- if $agc.albId -}}
    {{- $_ := set $preset (print $prefix "alb-id") $agc.albId -}}
  {{- else if $agc.albName -}}
    {{- $_ := set $preset (print $prefix "alb-name") $agc.albName -}}
    {{- $_ := set $preset (print $prefix "alb-namespace") (required "'agw.httpRoute.azureAgc.albNamespace' is required with 'albName'" $agc.albNamespace) -}}
  {{- else -}}
    {{- fail "'agw.httpRoute.azureAgc.albName' and 'albNamespace', or 'albId' and 'albFrontend', are required" -}}
  {{- end -}}
{{- end -}}
{{- $annotations := merge (deepCopy ($route.gateway.annotations | default dict)) $preset -}}
{{- with $annotations -}}
  {{ toYaml . }}
{{- end -}}
{{- end }}

{{- define "hush-agw.gatewayListenerTls" -}}
{{- $route := .Values.agw.httpRoute -}}
{{- $controller := include "hush-agw.httpRouteController" . -}}
{{- if $route.gateway.tls.secretName -}}
mode: Terminate
certificateRefs:
  - name: {{ $route.gateway.tls.secretName }}
{{- else if and (eq $controller "gke-gateway") $route.gkeGateway.preSharedCertificate -}}
mode: Terminate
options:
  networking.gke.io/pre-shared-certs: {{ $route.gkeGateway.preSharedCertificate }}
{{- end -}}
{{- end }}

{{- define "hush-agw.gatewayAddresses" -}}
{{- $agc := .Values.agw.httpRoute.azureAgc -}}
{{- if and (eq (include "hush-agw.httpRouteController" .) "azure-agc") $agc.albId -}}
- type: alb.networking.azure.io/alb-frontend
  value: {{ required "'agw.httpRoute.azureAgc.albFrontend' is required with 'albId'" $agc.albFrontend }}
{{- end -}}
{{- end }}
