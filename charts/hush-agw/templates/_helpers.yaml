{{/*
External base URL clients reach the gateway on, built from the hostname.
*/}}
{{- define "hush-agw.baseUrl" -}}
{{- $host := required "'agw.hostname' is required" .Values.agw.hostname -}}
{{- if ne $host (lower $host) -}}
{{- fail "'agw.hostname' must be lowercase" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$" $host) -}}
{{- fail "'agw.hostname' must be a bare domain name, without a scheme, port or path" -}}
{{- end -}}
https://{{ $host }}
{{- end }}

{{/*
Image path for the agw-controller container.
*/}}
{{- define "hush-agw.controllerImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.controllerRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-agentgateway container.
*/}}
{{- define "hush-agw.agentgatewayImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.agentgatewayRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-vector container.
*/}}
{{- define "hush-agw.vectorImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.vectorRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Image path for the agw-genai-toolbox container.
*/}}
{{- define "hush-agw.genaiToolboxImagePath" -}}
{{- $ctx := dict
    "registry" (include "hush-common.imageRegistry" .)
    "repository" .Values.image.genaiToolboxRepository
    "tag" (include "hush-common.imageTagOrAppVersion" .)
-}}
{{- include "hush-common.buildImagePath" $ctx -}}
{{- end }}

{{/*
Persistent volume claim name for the gateway's data.
*/}}
{{- define "hush-agw.dataClaimName" -}}
{{- if .Values.agw.persistence.existingClaim -}}
  {{- .Values.agw.persistence.existingClaim -}}
{{- else -}}
  {{- printf "%s-data" (include "hush-common.fullName" .) -}}
{{- end -}}
{{- end }}

{{/*
Shared environment for the agw-controller (init + server).
*/}}
{{- define "hush-agw.controllerEnv" -}}
{{- with (include "hush-common.effectiveDeploymentTokenKubeSecretRefWithSensorFallback" . | fromYaml) }}
- name: DEPLOYMENT_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
{{- with (include "hush-common.effectiveDeploymentPasswordKubeSecretRefWithSensorFallback" . | fromYaml) }}
- name: DEPLOYMENT_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
- name: DEPLOYMENT_KIND
  value: k8s
- name: HUSH_AUTH_MODE
  value: {{ .Values.hushDeployment.authMode | quote }}
- name: ADDR
  value: ":8080"
- name: XDS_ADDR
  value: ":18000"
- name: BASE_URL
  value: {{ include "hush-agw.baseUrl" . | quote }}
- name: INTERNAL_BASE_URL
  value: "http://localhost:8080"
- name: DB_DIR
  value: /data
- name: DYNAMIC_OAUTH_REGISTRATION_TTL
  value: {{ .Values.agw.dynamicOAuthRegistrationTTL | quote }}
- name: HUSH_K8S_SA_TOKEN_PATH
  value: {{ include "hush-common.k8sSaTokenPath" . | quote }}
- name: TOOLBOX_CONFIG_PATH
  value: /etc/toolbox/tools.yaml
- name: TOOLBOX_URL
  value: http://localhost:5000
{{ include "hush-common.siloEnvs" . }}
{{- with (include "hush-agw.awsWebIdentityEnvs" .) }}
{{ . }}
{{- end }}
{{- end }}

{{/*
Environment for the agw-vector container.
*/}}
{{- define "hush-agw.vectorEnv" -}}
{{- with (include "hush-common.effectiveDeploymentTokenKubeSecretRefWithSensorFallback" . | fromYaml) }}
- name: DEPLOYMENT_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
{{- with (include "hush-common.effectiveDeploymentPasswordKubeSecretRefWithSensorFallback" . | fromYaml) }}
- name: DEPLOYMENT_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
- name: DEPLOYMENT_KIND
  value: k8s
- name: HUSH_AUTH_MODE
  value: {{ .Values.hushDeployment.authMode | quote }}
- name: TOKENGEN_SKIP_ON_NO_CONFIG
  value: "1"
- name: HUSH_K8S_SA_TOKEN_PATH
  value: {{ include "hush-common.k8sSaTokenPath" . | quote }}
- name: HELM_RELEASE
  value: {{ .Release.Name }}
- name: HELM_NAMESPACE
  value: {{ include "hush-common.namespace" . }}
- name: HELM_CHART_VERSION
  value: {{ .Chart.Version | quote }}
{{- end }}

{{- define "hush-agw.kubeApiTokenVolume" -}}
- name: kube-api-access
  projected:
    sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3607
      - configMap:
          name: kube-root-ca.crt
          items:
            - key: ca.crt
              path: ca.crt
      - downwardAPI:
          items:
            - path: namespace
              fieldRef:
                fieldPath: metadata.namespace
{{- end }}

{{- define "hush-agw.kubeApiTokenVolumeMount" -}}
- name: kube-api-access
  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
  readOnly: true
{{- end }}

{{/*
AWS IAM role the gateway assumes with its projected K8S SA token
*/}}
{{- define "hush-agw.awsOidcRole" -}}
{{- $aws := .Values.agw.workloadIdentity.aws -}}
{{- $role := dig "oidc" "role" "" $aws -}}
{{- if $role -}}
  {{- if $aws.irsa -}}
      {{- fail "'agw.workloadIdentity.aws.oidc.role' must not be combined with 'agw.workloadIdentity.aws.irsa'" -}}
  {{- end -}}
  {{- if (include "hush-common.siloAwsAccessToken" .) -}}
      {{- fail "'agw.workloadIdentity.aws.oidc.role' must not be combined with 'secretStore.aws.access_key'" -}}
  {{- end -}}
{{- end -}}
{{ $role }}
{{- end }}

{{/*
Audience of the K8S SA token the gateway presents to AWS STS
*/}}
{{- define "hush-agw.awsOidcAudience" -}}
{{- dig "oidc" "audience" "" .Values.agw.workloadIdentity.aws | default "sts.amazonaws.com" -}}
{{- end }}

{{/*
Projected volume carrying the K8S SA token AWS STS exchanges for credentials
*/}}
{{- define "hush-agw.awsWebIdentityVolume" -}}
{{- include "hush-common.awsWebIdentityVolume" (dict
    "role" (include "hush-agw.awsOidcRole" .)
    "audience" (include "hush-agw.awsOidcAudience" .)) -}}
{{- end }}

{{/*
Volume mount for the projected AWS web identity token
*/}}
{{- define "hush-agw.awsWebIdentityVolumeMount" -}}
{{- include "hush-common.awsWebIdentityVolumeMount" (dict
    "role" (include "hush-agw.awsOidcRole" .)) -}}
{{- end }}

{{/*
Envs directing the AWS SDK to assume a role with the projected K8S SA token
*/}}
{{- define "hush-agw.awsWebIdentityEnvs" -}}
{{- include "hush-common.awsWebIdentityEnvs" (dict
    "role" (include "hush-agw.awsOidcRole" .)) -}}
{{- end }}

{{/*
Annotations of the gateway service account
*/}}
{{- define "hush-agw.serviceAccountAnnotations" -}}
{{- $identity := dict -}}
{{- with .Values.agw.workloadIdentity.aws.irsa -}}
  {{- $_ := set $identity "eks.amazonaws.com/role-arn" . -}}
{{- end -}}
{{- with .Values.agw.workloadIdentity.gcp.sa -}}
  {{- $_ := set $identity "iam.gke.io/gcp-service-account" . -}}
{{- end -}}
{{- $annotations := merge (deepCopy (.Values.agw.serviceAccount.annotations | default dict)) $identity -}}
{{- with $annotations -}}
{{ toYaml . }}
{{- end -}}
{{- end }}

{{/*
Annotations of the gateway pod. With irsa, the EKS webhook hands the role to
the containers that reach the secret store only.
*/}}
{{- define "hush-agw.podAnnotations" -}}
{{- $identity := dict -}}
{{- if .Values.agw.workloadIdentity.aws.irsa -}}
  {{- $_ := set $identity "eks.amazonaws.com/skip-containers" "agw-agentgateway,agw-vector,agw-genai-toolbox" -}}
{{- end -}}
{{- $annotations := merge (deepCopy (.Values.agw.annotations | default dict)) $identity -}}
{{- with $annotations -}}
{{ toYaml . }}
{{- end -}}
{{- end }}
