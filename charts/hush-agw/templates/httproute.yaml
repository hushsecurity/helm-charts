{{- if .Values.agw.httpRoute.enabled }}
  {{- if .Values.agw.ingress.enabled }}
    {{- fail "'agw.ingress' and 'agw.httpRoute' cannot both be enabled" }}
  {{- end }}
  {{- if eq (include "hush-agw.serviceType" .) "LoadBalancer" }}
    {{- fail "'agw.httpRoute' cannot be enabled with a LoadBalancer Service" }}
  {{- end }}
  {{- $route := .Values.agw.httpRoute }}
  {{- $controller := include "hush-agw.httpRouteController" . }}
  {{- if $route.gateway.enabled }}
    {{- if and (eq $controller "aws-alb") $route.gateway.tls.secretName }}
      {{- fail "'agw.httpRoute.gateway.tls.secretName' cannot be used with aws-alb, which takes the certificate from ACM" }}
    {{- end }}
    {{- if and (eq $controller "azure-agc") (not $route.gateway.tls.secretName) }}
      {{- fail "'agw.httpRoute.gateway.tls.secretName' is required for azure-agc, which takes the certificate from a Secret only" }}
    {{- end }}
    {{- if eq $controller "gke-gateway" }}
      {{- $sources := compact (list $route.gateway.tls.secretName $route.gkeGateway.certificateMap $route.gkeGateway.preSharedCertificate) }}
      {{- if ne (len $sources) 1 }}
        {{- fail "exactly one of 'agw.httpRoute.gateway.tls.secretName', 'agw.httpRoute.gkeGateway.certificateMap' and 'agw.httpRoute.gkeGateway.preSharedCertificate' is required" }}
      {{- end }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-api-gateway
  namespace: {{ include "hush-common.namespace" . }}
    {{- with include "hush-agw.gatewayAnnotations" . }}
  annotations: {{- . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ include "hush-agw.gatewayClassName" . }}
    {{- with include "hush-agw.gatewayInfrastructure" . }}
  infrastructure: {{- . | nindent 4 }}
    {{- end }}
    {{- with include "hush-agw.gatewayAddresses" . }}
  addresses: {{- . | nindent 4 }}
    {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ include "hush-agw.hostname" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- with include "hush-agw.gatewayListenerTls" . }}
      tls: {{- . | nindent 8 }}
    {{- end }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-http-route
  namespace: {{ include "hush-common.namespace" . }}
  {{- with $route.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- include "hush-agw.httpRouteParentRefs" . | nindent 4 }}
  hostnames:
    - {{ include "hush-agw.hostname" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "hush-common.fullName" . }}
          port: {{ include "hush-agw.servicePort" . }}
  {{- if eq $controller "azure-agc" }}
    {{- with $route.azureAgc.requestTimeout }}
      timeouts:
        request: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
