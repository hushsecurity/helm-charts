{{- if eq (toString .Values.agw.secretStore.kind) "kubesecrets" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-role
  namespace: {{ include "hush-common.kubeSiloNamespace" (dict "store" .Values.agw.secretStore "path" "agw.secretStore" "root" .) }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
{{- end }}
