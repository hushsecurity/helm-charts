{{- if eq (toString .Values.secretStore.kind) "kubesecrets" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-role-binding
  namespace: {{ include "hush-common.kubeSiloNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hush-common.fullName" . }}
    namespace: {{ include "hush-common.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "hush-common.fullName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
