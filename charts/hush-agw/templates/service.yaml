apiVersion: v1
kind: Service
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-service
  namespace: {{ include "hush-common.namespace" . }}
  {{- with include "hush-agw.serviceAnnotations" . }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- $type := include "hush-agw.serviceType" . }}
  type: {{ $type }}
  {{- if eq $type "LoadBalancer" }}
    {{- if eq (include "hush-agw.serviceLoadBalancer" .) "aws-nlb" }}
  allocateLoadBalancerNodePorts: false
    {{- end }}
    {{- with .Values.agw.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
    {{- end }}
    {{- with .Values.agw.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  selector: {{- include "hush-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: gateway
      port: {{ include "hush-agw.servicePort" . }}
      targetPort: gateway-http
