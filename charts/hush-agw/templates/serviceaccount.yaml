apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hush-common.fullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-service-account
  namespace: {{ include "hush-common.namespace" . }}
  {{- with (include "hush-agw.serviceAccountAnnotations" .) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
