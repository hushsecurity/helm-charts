# Default values for hush-agw.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""

# This is to override the chart fullname.
fullnameOverride: ""

# Override the namespace used for all objects.
# If not specified '.Release.Namespace' is used.
namespaceOverride: ""

# Labels applied to all resources.
# For more information see
# https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
commonLabels: {}

# Hush deployment configuration
hushDeployment:
  # Authentication mode for Hush API token exchange.
  # Allowed values:
  # - password - use deployment password (default)
  # - oidc - use K8S SA token (oidc_provider must be configured in deployment)
  authMode: "password"

  # OIDC authentication settings. Used only when 'hushDeployment.authMode' is "oidc".
  oidc:
    # Audience ('aud' claim) requested for the projected K8S service account
    # token sent as the OIDC assertion. It must match the audience configured in
    # the deployment's oidc_provider.
    #
    # Empty (the default) requests no explicit audience, keeping the cluster
    # default for backward compatibility. On EKS the platform default is
    # "https://kubernetes.default.svc".
    audience: ""

  # The deployment token as received from API/UI.
  # When 'hushDeployment.secretKeyRef.{name,tokenKey}' are defined this value is ignored.
  # Given neither, the Secret named by 'hushDeployment.sensorDeploymentSecretName'
  # is used; with that empty, this value is required.
  token: ""

  # The deployment password as received from API/UI.
  # Only used when 'hushDeployment.authMode' is "password"; ignored when
  # 'hushDeployment.secretKeyRef.{name,key}' are defined.
  # Given neither, the Secret named by 'hushDeployment.sensorDeploymentSecretName'
  # is used; with that empty, this value is required.
  password: ""

  # A reference to an existing Secret with deployment password and token.
  #
  # The secret must be defined in the same namespace where the chart is installed.
  #
  # If deployment token is stored this way updating its value in the Secret
  # must be followed by chart recompilation (helm upgrade/template) or
  # fresh installation (helm install).
  secretKeyRef:
    # Secret name
    name: ""

    # Password secret key
    # Only used when 'hushDeployment.authMode' is "password".
    # Together with 'name', takes precedence over 'hushDeployment.password'.
    key: ""

    # Token secret key
    # Together with 'name', takes precedence over 'hushDeployment.token'.
    tokenKey: ""

  # Name of the deployment Secret a hush-sensor release created in this
  # namespace. The token and the password each fall back to it when neither
  # 'secretKeyRef' names them nor the inline value is given. Set it empty to
  # require the chart's own credentials instead.
  sensorDeploymentSecretName: hush-sensor-deploymentsecret

# Values related to Hush Security container images
image:
  # Image pull token contains registry information and credentials
  pullToken: ""

  # Container registry to pull images from
  #
  # This value is ignored when 'image.pullToken' is defined.
  registry: hushsecurity.azurecr.io

  # Overrides the image tag for all Hush AGW images.
  #
  # When not defined '.Chart.appVersion' is used. Ensure compatibility when overriding.
  tag: ""

  # Image repository for the agw-controller container.
  controllerRepository: agw-controller

  # Image repository for the agw-agentgateway container.
  agentgatewayRepository: agw-agentgateway

  # Image repository for the agw-vector container.
  vectorRepository: agw-vector

  # Image repository for the agw-genai-toolbox container.
  genaiToolboxRepository: agw-genai-toolbox

  # A list of pre-created image pull secrets of the form:
  #
  # pullSecretList:
  #   - name: "<secret-name-here>"
  #
  # Secrets must be pre-created in the same namespace where the chart is installed.
  #
  # When this list is empty 'image.pullSecret' can be used to create a secret
  # automatically.
  #
  # More information can be found here:
  # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecretList: []

  # Creates a Secret for pulling images
  #
  # When 'image.pullToken' is defined the credentials for the Secret are taken
  # from there. Otherwise both 'username' and 'password' must be defined.
  #
  # When 'image.pullSecretList' is non-empty the created secret is not used.
  pullSecret:
    # Custom pull secret name.
    # When not defined chart's full name is used with '-imagepullsecret' suffix.
    name: ""

    # Pull secret username
    #
    # This value is ignored when 'image.pullToken' is defined.
    username: ""

    # Pull secret password
    #
    # This value is ignored when 'image.pullToken' is defined.
    password: ""

  # Name of image pull secret created by the hush-sensor chart, used as a
  # fallback when none is created here (co-install scenario).
  sensorImagePullSecretName: hush-sensor-imagepullsecret

  # The pull policy for images.
  pullPolicy: Always

# Hush AGW workload. All values specific to Hush AGW live here.
agw:
  # External hostname (FQDN) where clients and the OAuth browser flow reach
  # Hush AGW. Required.
  #
  # It must resolve to your ingress/load balancer, be reachable by clients'
  # browsers, and match the certificate your edge serves. TLS is terminated at
  # your ingress/load balancer, not by Hush AGW.
  #
  # It must also be exactly the hostname recorded on this deployment in Hush.
  # Nothing reconciles the two, and connecting an application fails while they
  # disagree.
  hostname: ""

  # The Service clients reach Hush AGW through, on its port named "gateway".
  #
  # Hush AGW serves plain HTTP. Whatever fronts it -- 'agw.ingress',
  # 'agw.httpRoute', a LoadBalancer Service, or an ingress or load balancer of
  # your own -- must:
  # - terminate TLS on port 443 with a certificate for 'agw.hostname';
  # - send every path of 'agw.hostname' to Hush AGW, not only /mcp;
  # - run any health check against port 15021 at path /healthz/ready. The
  #   port that serves clients answers 404 on '/', which a default HTTP health
  #   check takes for a failure;
  # - keep an idle connection open well beyond the 60 seconds many load
  #   balancers default to. MCP holds a connection open for a whole session,
  #   and a shorter timeout cuts it mid-stream.
  service:
    # ClusterIP or LoadBalancer.
    #
    # A ClusterIP listens on port 3001. A LoadBalancer listens on port 443, the
    # port the https URL of Hush AGW names, and works only where the load
    # balancer terminates TLS itself, such as an AWS Network Load Balancer with
    # a TLS listener. One that forwards TCP as it comes hands clients the plain
    # HTTP of Hush AGW, which they refuse.
    type: ClusterIP

    # Annotations for the Service, through which a cloud load balancer is
    # usually configured.
    annotations: {}

    # Load balancer implementation that handles the Service, for a
    # LoadBalancer only, for example "service.k8s.aws/nlb" for the AWS Load
    # Balancer Controller. Empty leaves the Service to the cluster's default
    # implementation. It cannot be changed once set.
    # https://kubernetes.io/docs/concepts/services-networking/service/#load-balancer-class
    loadBalancerClass: ""

    # Client addresses allowed through the load balancer, as CIDR ranges, for
    # example ["203.0.113.0/24"]. Traffic from any other address is dropped.
    # Empty allows every address.
    #
    # It applies to a LoadBalancer only, not to 'agw.ingress' or
    # 'agw.httpRoute', and it is up to the cloud: one that does not support it
    # ignores it. The AWS Load Balancer Controller applies it through the
    # security group it gives the load balancer.
    # https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/#ServiceSpec
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/deploy/security_groups/
    loadBalancerSourceRanges: []

    # A load balancer the chart sets the Service up for, so that it meets the
    # requirements above: "" for none, or "aws-nlb" for an AWS Network Load
    # Balancer, configured under 'awsNlb'. It makes the Service a LoadBalancer,
    # whatever 'type' says. Keys in 'annotations' replace the ones it sets.
    #
    # Examples for each load balancer and ingress controller are in
    # https://github.com/hushsecurity/helm-charts/tree/main/charts/hush-agw/ci
    loadBalancer: ""

    # An AWS Network Load Balancer, for 'loadBalancer: aws-nlb', through the
    # AWS Load Balancer Controller, which must be installed in the cluster:
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/
    #
    # On EKS Auto Mode, Auto Mode creates it instead, with no controller to
    # install, though its list of supported annotations does not include the
    # TLS policy one, which an empty 'sslPolicy' leaves out:
    # https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-nlb.html
    #
    # Its TLS listener closes a connection idle for 350 seconds, and this
    # cannot be changed. It also cannot send all of a client's connections to
    # the same Hush AGW pod. Where either matters, use 'agw.ingress' or
    # 'agw.httpRoute' instead.
    awsNlb:
      # "internet-facing" or "internal".
      scheme: internet-facing

      # ARN of the ACM certificate for 'agw.hostname'. Required.
      certificateArn: ""

      # Security policy of the TLS listener. The default accepts TLS 1.2 and
      # 1.3 only, while the controller's own default also accepts TLS 1.0 and
      # 1.1. Empty leaves the controller's default.
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

      # Cross-zone load balancing, which an NLB leaves off unless set. When
      # true, the NLB's node in each zone sends connections to Hush AGW pods
      # in every zone, and AWS charges for the data that crosses zones. When
      # false, it sends them only to the Hush AGW pods of its own zone, and
      # AWS takes a zone without a healthy Hush AGW pod out of the NLB's DNS
      # name.
      #
      # It goes into the annotation
      # 'service.beta.kubernetes.io/aws-load-balancer-attributes', which, given
      # in 'annotations', replaces it.
      # https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html#cross-zone-load-balancing
      crossZone: true

  # An Ingress for 'agw.hostname' that sends every path to the Service. It must
  # meet the requirements listed under 'agw.service', which most ingress
  # controllers take as annotations. It cannot be enabled together with a
  # LoadBalancer Service.
  ingress:
    # Whether to create the Ingress.
    enabled: false

    # The ingress controller the chart sets the Ingress up for, so that it
    # meets the requirements under 'agw.service': "" for any controller, set
    # up through 'className' and 'annotations', or one of:
    # - "aws-alb": an AWS Application Load Balancer, configured under 'awsAlb';
    # - "gke-ingress": GKE Ingress, an external Application Load Balancer,
    #   configured under 'gkeIngress';
    # - "azure-agc": Azure Application Gateway for Containers, configured under
    #   'azureAgc'.
    #
    # 'className' and keys in 'annotations' replace what it sets, except that
    # gke-ingress takes no 'className'.
    #
    # Examples for each ingress controller and load balancer are in
    # https://github.com/hushsecurity/helm-charts/tree/main/charts/hush-agw/ci
    controller: ""

    # IngressClass of the controller that serves the Ingress. When empty the
    # cluster's default IngressClass is used, if it has one.
    className: ""

    # Annotations for the Ingress, through which most ingress controllers are
    # configured.
    annotations: {}

    tls:
      # Secret holding the certificate for 'agw.hostname', in the namespace the
      # chart is installed in. Leave it empty for a controller that takes the
      # certificate from an annotation instead, as the AWS Load Balancer
      # Controller does.
      secretName: ""

    # An AWS Application Load Balancer, for 'controller: aws-alb', through the
    # AWS Load Balancer Controller, which must be installed in the cluster:
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/
    awsAlb:
      # "internet-facing" or "internal".
      scheme: internet-facing

      # ARN of the ACM certificate for 'agw.hostname'. When empty the
      # controller finds a certificate for the hostname in ACM.
      certificateArn: ""

      # Seconds a connection may stay idle before the load balancer closes it.
      idleTimeout: 600

      # Security policy of the HTTPS listener. The default accepts TLS 1.2 and
      # 1.3 only, while the controller's own default also accepts TLS 1.0 and
      # 1.1. Empty leaves the controller's default.
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

      # Sticky sessions: the ALB keeps a client on one Hush AGW pod through a
      # cookie it sets, for clients that send it back. The cookie lasts
      # 'duration' seconds. AWS does not allow it with 'crossZone: false'.
      #
      # 'stickiness' and 'crossZone' go into the target group attributes. An
      # 'alb.ingress.kubernetes.io/target-group-attributes' annotation in
      # 'annotations' replaces both.
      # https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
      stickiness:
        enabled: false
        duration: 86400

      # Cross-zone load balancing. When true, the ALB's node in each zone sends
      # requests to Hush AGW pods in every zone. When false, it sends them only
      # to the Hush AGW pods of its own zone, and the ALB takes a zone without
      # a healthy Hush AGW pod out of its DNS name.
      crossZone: true

    # GKE Ingress, for 'controller: gke-ingress'. GKE takes the class from the
    # 'kubernetes.io/ingress.class' annotation alone, which the chart sets, so
    # 'className' cannot be used with it. The chart also marks the Service for
    # container-native load balancing, so that the load balancer reaches the
    # Hush AGW pods directly.
    gkeIngress:
      # A BackendConfig for the Hush AGW Service, which health checks Hush AGW
      # and sets how long a response may take. The load balancer cuts a
      # response that takes longer, an MCP stream included.
      backendConfig:
        enabled: true

        # Seconds from the request to the end of its response. GKE's default
        # is 30.
        timeoutSec: 1800

        # Session affinity, which keeps a client on one Hush AGW pod, for
        # example {affinityType: GENERATED_COOKIE, affinityCookieTtlSec: 86400}
        # or {affinityType: CLIENT_IP}. Empty turns it off.
        # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ingress-configuration
        sessionAffinity: {}

      # A Google-managed certificate for 'agw.hostname'. Turn it off when
      # 'tls.secretName' or an annotation of your own provides the certificate.
      managedCertificate:
        enabled: true

      # A FrontendConfig that redirects plain HTTP to HTTPS rather than serve
      # Hush AGW on port 80. GKE leaves its SSL policy on the load balancer when
      # it is turned off, so empty 'sslPolicy' in an upgrade first.
      frontendConfig:
        enabled: true

        # Name of an SSL policy, created in the cluster's Google Cloud project
        # with 'gcloud compute ssl-policies create', for example one with
        # '--min-tls-version 1.2'. When empty the load balancer uses Google's
        # default, which accepts TLS 1.0 and later.
        sslPolicy: ""

    # Azure Application Gateway for Containers, for 'controller: azure-agc',
    # through the ALB Controller, which must be installed in the cluster:
    # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/overview
    # It takes the certificate from a Secret only, so 'tls.secretName' is
    # required. The ALB Controller serves only Ingresses of the class
    # azure-alb-external, which the chart sets, so 'className' cannot be used
    # with it.
    #
    # It closes a connection idle for 5 minutes, whatever the request timeout:
    # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/application-gateway-for-containers-components
    azureAgc:
      # The ApplicationLoadBalancer the ALB Controller manages, by name and
      # namespace. Either these or 'albId' and 'albFrontend' are required.
      albName: ""
      albNamespace: ""

      # Or the resource ID of an Azure Application Gateway for Containers
      # managed outside the cluster, and the name of its frontend.
      albId: ""
      albFrontend: ""

      # A HealthCheckPolicy that health checks Hush AGW on its readiness port.
      healthCheckPolicy:
        enabled: true

      # An IngressExtension that sets how long a request may take. The load
      # balancer cuts a request that takes longer, an MCP stream included, even
      # while data flows. AGC's default is 60 seconds.
      ingressExtension:
        enabled: true
        requestTimeout: 1800s

        # Session affinity, which keeps a client on one Hush AGW pod, for
        # example {affinityType: managed-cookie}. Empty leaves it off.
        # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/session-affinity
        sessionAffinity: {}

  # An HTTPRoute of the Gateway API that sends every path of 'agw.hostname' to
  # Hush AGW. It takes the place of 'agw.ingress': enable one of them, not
  # both. It cannot be enabled together with a LoadBalancer Service either. The
  # Gateway it attaches to must meet the requirements under 'agw.service'.
  # https://gateway-api.sigs.k8s.io/reference/api-types/httproute/
  httpRoute:
    # Whether to create the HTTPRoute.
    enabled: false

    # The Gateway API implementation the chart sets the HTTPRoute up for, so
    # that it meets the requirements under 'agw.service': "" for any
    # implementation, or one of:
    # - "aws-alb": an AWS Application Load Balancer through the AWS Load
    #   Balancer Controller, configured under 'awsAlb';
    # - "gke-gateway": GKE Gateway, configured under 'gkeGateway';
    # - "azure-agc": Azure Application Gateway for Containers, configured under
    #   'azureAgc'.
    #
    # Keys in 'gateway.annotations' replace what it sets.
    #
    # Examples for each implementation are in
    # https://github.com/hushsecurity/helm-charts/tree/main/charts/hush-agw/ci
    controller: ""

    # Gateways the HTTPRoute attaches to, as its parentRefs, for example
    # [{name: shared, namespace: gateway-infra, sectionName: https}]. Each
    # listener must admit routes from the release's namespace. Required unless
    # 'gateway.enabled' is set, which attaches the HTTPRoute to the chart's own
    # Gateway instead.
    parentRefs: []

    # Annotations for the HTTPRoute.
    annotations: {}

    # A Gateway of the chart's own, for a cluster with no shared Gateway. It has
    # one HTTPS listener on port 443 for 'agw.hostname', which admits routes
    # from the release's namespace only.
    # https://gateway-api.sigs.k8s.io/reference/api-types/gateway/
    gateway:
      # Whether to create the Gateway.
      enabled: false

      # GatewayClass of the Gateway API implementation that serves it.
      # Required, except where 'controller' names a default.
      className: ""

      # Annotations for the Gateway.
      annotations: {}

      tls:
        # Secret holding the certificate for 'agw.hostname', in the namespace
        # the chart is installed in. Leave it empty for an implementation that
        # takes the certificate another way.
        secretName: ""

    # An AWS Application Load Balancer, for 'controller: aws-alb', through the
    # AWS Load Balancer Controller v3.5.0 or later, with the Gateway API CRDs
    # its release requires. The cluster admin creates its GatewayClass, with
    # controllerName gateway.k8s.aws/alb, which 'gateway.className' names.
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/gateway/gateway/
    awsAlb:
      # A TargetGroupConfiguration for the Hush AGW Service, with any Gateway:
      # pod IP targets, a health check on the readiness port, and the target
      # group attributes below. An ALB Gateway, a shared one included, needs it
      # or one of your own: without it the controller cannot send traffic to
      # the ClusterIP Service, and applies no change to that Gateway, whichever
      # route it comes from, while the HTTPRoute is attached.
      # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/gateway/targetgroupconfig/
      targetGroupConfiguration:
        enabled: true

        # Sticky sessions: the ALB keeps a client on one Hush AGW pod through
        # a cookie it sets, for clients that send it back. The cookie lasts
        # 'duration' seconds. AWS does not allow it with 'crossZone: false'.
        stickiness:
          enabled: false
          duration: 86400

        # Cross-zone load balancing. When true, the ALB's node in each zone
        # sends requests to Hush AGW pods in every zone. When false, it sends
        # them only to the Hush AGW pods of its own zone, and the ALB takes a
        # zone without a healthy Hush AGW pod out of its DNS name.
        crossZone: true

      # A LoadBalancerConfiguration for the chart's own Gateway, which refers
      # to it. A shared Gateway takes these settings from its owner.
      # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/gateway/loadbalancerconfig/
      loadBalancerConfiguration:
        enabled: true

        # "internet-facing" or "internal". The controller's own default is
        # "internal".
        scheme: internet-facing

        # ARN of the ACM certificate for 'agw.hostname'. When empty the
        # controller finds a certificate for the hostname in ACM. The
        # controller takes no certificate from a Secret.
        certificateArn: ""

        # Seconds a connection may stay idle before the load balancer closes
        # it.
        idleTimeout: 600

        # Security policy of the HTTPS listener. The default accepts TLS 1.2
        # and 1.3 only, while the controller's own default also accepts TLS 1.0
        # and 1.1. Empty leaves the controller's default.
        sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

    # GKE Gateway, for 'controller: gke-gateway', on a cluster with the Gateway
    # API enabled: always on Autopilot, and through
    # 'gcloud container clusters update --gateway-api=standard' on Standard.
    # GKE installs the GatewayClasses. The chart's own Gateway defaults to
    # gke-l7-global-external-managed, a global external Application Load
    # Balancer.
    # https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gateway-api
    gkeGateway:
      # A HealthCheckPolicy for the Hush AGW Service, with any Gateway, which
      # health checks Hush AGW on its readiness port.
      # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-gateway-resources
      healthCheckPolicy:
        enabled: true

      # A GCPBackendPolicy for the Hush AGW Service, with any Gateway, which
      # sets how long a response may take. The load balancer cuts a response
      # that takes longer, an MCP stream included.
      backendPolicy:
        enabled: true

        # Seconds from the request to the end of its response. GKE's default
        # is 30.
        timeoutSec: 1800

        # Session affinity, which keeps a client on one Hush AGW pod, for
        # example {type: GENERATED_COOKIE, cookieTtlSec: 86400} or
        # {type: CLIENT_IP}. Empty leaves it off.
        sessionAffinity: {}

      # The certificate of the chart's own Gateway: a Certificate Manager
      # certificate map, or a Compute Engine SSL certificate, such as a
      # Google-managed one created with
      # 'gcloud compute ssl-certificates create --domains --global'. Exactly
      # one of these two and 'gateway.tls.secretName' is required. GKE Gateway
      # takes no ManagedCertificate.
      # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/secure-gateway
      certificateMap: ""
      preSharedCertificate: ""

      # Name of an SSL policy for the chart's own Gateway, created in the
      # cluster's Google Cloud project with 'gcloud compute ssl-policies
      # create', for example one with '--min-tls-version 1.2'. The chart applies
      # it through a GCPGatewayPolicy. When empty the load balancer uses
      # Google's default, which accepts TLS 1.0 and later.
      sslPolicy: ""

    # Azure Application Gateway for Containers, for 'controller: azure-agc',
    # through the ALB Controller, which must be installed in the cluster. The
    # chart's own Gateway defaults to the class azure-alb-external and takes
    # its certificate from a Secret only, so 'gateway.tls.secretName' is
    # required with it.
    # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/overview
    #
    # It closes a connection idle for 5 minutes, whatever the request timeout:
    # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/application-gateway-for-containers-components
    azureAgc:
      # For the chart's own Gateway, the ApplicationLoadBalancer the ALB
      # Controller manages, by name and namespace. Either these or 'albId' and
      # 'albFrontend' are required.
      albName: ""
      albNamespace: ""

      # Or the resource ID of an Azure Application Gateway for Containers
      # managed outside the cluster, and the name of its frontend.
      albId: ""
      albFrontend: ""

      # A HealthCheckPolicy for the Hush AGW Service, with any Gateway, which
      # health checks Hush AGW on its readiness port.
      # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/custom-health-probe
      healthCheckPolicy:
        enabled: true

      # How long a request may take, set on the HTTPRoute. AGC cuts a request
      # that takes longer, an MCP stream included, even while data flows.
      # AGC's default is 60 seconds.
      requestTimeout: 1800s

      # Session affinity, which keeps a client on one Hush AGW pod, for
      # example {affinityType: managed-cookie}, applied through a RoutePolicy
      # for the HTTPRoute. Empty leaves it off.
      # https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/session-affinity
      sessionAffinity: {}

  # How long an unconsented dynamic OAuth registration stays valid, in seconds.
  #
  # This must match the value configured in the Hush authorization server. Do not
  # change it unless Hush support instructs you to.
  dynamicOAuthRegistrationTTL: 3600

  # A PersistentVolumeClaim for the local state of Hush AGW.
  #
  # Hush AGW keeps its state in Hush and rebuilds it when a pod starts, so it
  # no longer needs the claim. Turn the claim off only after Hush AGW has
  # started on it at least once with chart 0.11.0 or later, which uploads the
  # tokens and OAuth clients kept on it to Hush. Turning it off leaves the
  # chart's claim behind, unless 'retainOnDelete' is false, and stops using a
  # claim named in 'existingClaim'; remove either by hand.
  # DEPRECATED: set 'enabled' to false and use 'agw.dataVolume' instead.
  persistence:
    # Whether to use a PersistentVolumeClaim.
    #
    # When false each pod rebuilds the state from Hush on an empty volume.
    enabled: true

    # Size of the volume claim.
    size: 1Gi

    # Access modes for the volume claim.
    accessModes:
      - ReadWriteOnce

    # Storage class name. When empty the cluster default is used, so the cluster
    # must have a default StorageClass or the claim stays Pending and the pod
    # never starts.
    storageClassName: ""

    # Keep the volume claim when the release is uninstalled.
    #
    # The claim is left behind so a reinstall keeps the state, at the cost of an
    # orphaned claim to remove by hand once it is genuinely unwanted. Set this to
    # false to have the claim removed with the release, discarding the state.
    #
    # A kept claim is reused only by a reinstall under the same release name and
    # namespace. Under a different name the install fails until the claim is
    # removed or named in 'existingClaim'.
    #
    # Ignored when 'existingClaim' is set, since the chart does not own that
    # claim and never removes it.
    retainOnDelete: true

    # Use a pre-created claim instead of creating one. When set, the chart does
    # not create a PVC. Ignored when 'enabled' is false.
    existingClaim: ""

  # The volume each Hush AGW pod keeps its local copy of the state on when
  # 'agw.persistence.enabled' is false. The pod rebuilds the state from Hush
  # when it starts, so the volume lives and dies with the pod.
  dataVolume:
    # Allowed values:
    # - "emptyDir"  - a directory on the node's disk, shared with the other
    #                 pods of the node
    # - "ephemeral" - a volume of the pod's own from 'storageClassName',
    #                 created with the pod and deleted with it, with the
    #                 capacity and IOPS of its class. Each new pod waits for
    #                 its volume to be created and attached, so it starts more
    #                 slowly.
    # https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/#generic-ephemeral-volumes
    type: emptyDir

    # Size of the volume. The kubelet evicts a pod whose emptyDir grows past
    # it.
    size: 1Gi

    # StorageClass of an "ephemeral" volume. When empty the cluster default is
    # used, so the cluster must have a default StorageClass or the pod stays
    # Pending. A zonal class needs volumeBindingMode WaitForFirstConsumer, so
    # that each volume is created in the zone of its pod's node.
    storageClassName: ""

  # Number of Hush AGW pods. Each one rebuilds its state from Hush, so more
  # than one keeps Hush AGW up when a pod or a node goes down. More than one
  # needs 'agw.persistence.enabled: false', since the pods cannot share the
  # volume claim.
  replicas: 1

  # How the Hush AGW pods spread across zones and nodes, with more than one pod.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints:
    # Allowed values:
    # - "zones_nodes" - spread across zones and across the nodes of each zone
    # - "zones"       - spread across zones. Any constraint turns off the
    #                   scheduler's own spreading across nodes, so several pods
    #                   may then run on one node.
    # - "nodes"       - spread across nodes
    # - "custom"      - use the constraints in 'custom'
    # - "none"        - leave the spreading to the scheduler's defaults
    #
    # "zones" and "zones_nodes" need the topology.kubernetes.io/zone label on
    # every node, as on EKS, GKE and AKS. With "ScheduleAnyway" the pods are
    # not spread across a node without it; with "DoNotSchedule" no pod lands
    # there at all. Choose "nodes" on a cluster without zone labels.
    type: zones_nodes

    # What the scheduler does when it cannot keep the pods spread, with every
    # type but "custom" and "none".
    #
    # Allowed values:
    # - "ScheduleAnyway" - schedule the pod anyway, as evenly as it can
    # - "DoNotSchedule"  - leave the pod pending
    whenUnsatisfiable: ScheduleAnyway

    # Constraints used as given when 'type' is "custom".
    custom: []

  # Custom priority class name.
  priorityClassName: ""

  # Custom node selector.
  nodeSelector: {}

  # A list of tolerations.
  tolerations: []

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
                  - arm64

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Annotations for the ServiceAccount. They win over the ones
  # 'agw.workloadIdentity' sets.
  serviceAccount:
    annotations: {}

  # Workload Identity configuration for the Hush AGW service account: the
  # identity an awssm, awsssm, gcpsm or az_key_vault secret store is reached
  # with.
  workloadIdentity:
    # AWS configuration
    aws:
      # AWS IAM role ARN to configure with irsa annotations
      #
      # For more information see:
      # https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
      irsa: ""

      # OIDC configuration for clusters outside EKS.
      #
      # Hush AGW presents its Kubernetes service account token and assumes
      # the role with it, the way irsa works on EKS. Register the cluster OIDC
      # issuer as an IAM OIDC identity provider, and let the role be assumed
      # over that provider by the Hush AGW service account. Its subject is
      # 'system:serviceaccount:<namespace>:<account>', where <account> is the
      # Hush AGW service account name the chart derives from the release:
      # 'hush-agw' for a release named 'hush-agw'.
      #
      # Mutually exclusive with every other AWS credential: 'irsa' here and
      # 'agw.secretStore.aws.access_key'.
      #
      # For more information see:
      # https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
      oidc:
        # AWS IAM role ARN to assume
        role: ""

        # Audience the token is minted for, and the one the IAM OIDC identity
        # provider is registered with. "sts.amazonaws.com" is the audience IRSA
        # uses on EKS, and is used when this value is empty.
        audience: "sts.amazonaws.com"

    # GCP configuration
    gcp:
      # GCP IAM Service Account to use for Workload Identity annotation
      #
      # For more information see:
      # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity#kubernetes-sa-to-iam
      sa: ""

    # Azure configuration
    azure:
      # Azure Workload Identity Client ID to use for Service Account annotation.
      # The chart also labels the pod, and Azure's webhook hands the identity
      # to the containers that reach the secret store only.
      #
      # For more information see:
      # https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
      clientId: ""

  # Secret store Hush AGW keeps the private halves of its access manager keys
  # in. The same settings as hush-am's 'secretStore'.
  #
  # A Hush AGW that shares its Hush deployment with hush-am must use hush-am's
  # secret store: the same kind, prefix and location. Either of them may create
  # the deployment's next key, and the other reads it from there.
  secretStore:
    # The secret store kind
    # Allowed values are:
    # - awssm: AWS Secrets Manager
    # - awsssm: AWS SSM Parameter Store
    # - gcpsm: GCP Secret Manager
    # - kubesecrets: K8S Secrets
    # - hc_vault: HashiCorp Vault KV v2
    # - az_key_vault: Azure Key Vault
    kind: "kubesecrets"

    # A prefix used to distinguish the secrets Hush AGW creates, and to place
    # them under a path of your choosing. Lowercase, starting and ending with a
    # letter or digit, and fixed once secrets exist under it. An invalid prefix
    # fails the install. '.' may not repeat.
    #
    #   kind         max  punctuation      notes
    #   awssm         80  - _ . + = @ /
    #   awsssm        80  - _ . /          at most 9 '/'-separated segments in
    #                                      the prefix; may not start with "aws"
    #                                      or "ssm"
    #   gcpsm         80  - _
    #   kubesecrets   80  - .              a Kubernetes Secret name
    #   hc_vault      80  - _ . /          a KV v2 path under the mount
    #   az_key_vault  32  -                a Key Vault secret name, which allows
    #                                      no other punctuation and is capped at
    #                                      127 characters -- the only kind whose
    #                                      limit binds the prefix
    #
    # Check the credential of Hush AGW before choosing a prefix outside the path
    # it was provisioned with -- for AWS an IRSA policy naming
    # 'secret:<prefix>/*' -- or Hush AGW installs and then fails every write.
    prefix: "hush"

    # AWS secret store configuration (used by awssm and awsssm)
    aws:
      # AWS access key (not recommended in production environments; used for testing)
      access_key:
        # AWS_SECRET_ACCESS_KEY value
        secret_access_key: ""
        # AWS_ACCESS_KEY_ID value
        access_key_id: ""
        # AWS_SESSION_TOKEN value (for temporary credentials)
        session_token: ""

      # AWS region name, e.g. "us-east-1"
      region: ""

      # Optional customer-managed KMS key used to encrypt the secret values.
      #
      # Accepts a KMS key ID, key ARN, alias name, or alias ARN. When empty, AWS
      # uses the default account-managed key: aws/secretsmanager for 'awssm',
      # aws/ssm for 'awsssm'.
      #
      # Behaviour and required KMS permissions depend on 'agw.secretStore.kind'.
      # In both cases the permissions must be granted to the principal the
      # Hush AGW reaches the secret store with (e.g. the IRSA role configured
      # under 'agw.workloadIdentity.aws.irsa').
      #
      # awssm (AWS Secrets Manager):
      #   - The KMS key is applied on CreateSecret only. Existing secrets
      #     keep the KMS key they were created with.
      #   - Secrets Manager uses envelope encryption: it asks KMS for a data
      #     key under this CMK on CreateSecret / PutSecretValue, and calls
      #     Decrypt on GetSecretValue to unwrap that data key.
      #   - Required KMS actions on the key:
      #       kms:GenerateDataKey  -- CreateSecret / PutSecretValue
      #       kms:Decrypt          -- GetSecretValue (unwrap the data key)
      #
      # awsssm (AWS SSM Parameter Store):
      #   - The KMS key is applied on every PutParameter, including
      #     overwrites of existing parameters.
      #   - Parameter Store uses different KMS operations depending on the
      #     parameter tier: kms:Encrypt for standard SecureString parameters
      #     (up to 4 KB) and kms:GenerateDataKey for advanced SecureString
      #     parameters (up to 8 KB, via envelope encryption with the AWS
      #     Encryption SDK). The secret store uses Intelligent-Tiering, so an
      #     individual parameter can land in either tier and the role must
      #     allow both.
      #   - Required KMS actions on the key:
      #       kms:Encrypt          -- PutParameter for standard SecureString
      #       kms:GenerateDataKey  -- PutParameter for advanced SecureString
      #       kms:Decrypt          -- GetParameter / GetParameters /
      #                               GetParametersByPath with
      #                               WithDecryption=true
      kmsKeyId: ""

    # GCP secret store configuration (used by gcpsm)
    gcp:
      # GCP project ID
      projectId: ""

      # GCP service account key JSON (not recommended in production environments; used for testing)
      #
      # For more information see:
      # https://cloud.google.com/iam/docs/keys-create-delete
      credentials_json: ""

    # Kubernetes secret store configuration
    k8s:
      # K8S namespace to store secrets in. It must already exist.
      # If not specified, the namespace where the chart is installed is used.
      namespace: ""

      # Additional namespaces where Hush AGW may manage secrets, for k8s
      # secret stores that the Secret Store API places outside its own
      # namespace. Each namespace must already exist; Hush AGW is
      # granted access in each of them (a scoped Role and RoleBinding each),
      # never cluster-wide.
      additionalNamespaces: []

    # HashiCorp Vault secret store configuration (used by hc_vault)
    hcVault:
      # Vault address, e.g. "https://vault.example.com:8200". Must be https: a
      # login and every request afterwards carry a credential.
      address: ""

      # The KV version 2 mount to store secrets in. When empty, "secret" is used.
      # It must exist and be version 2; version 1 is refused at startup.
      mount: ""

      # Vault Enterprise namespace the mount lives in, e.g. "admin/team-a".
      # Leave empty on Vault Community Edition, which has no namespaces.
      namespace: ""

      # PEM bundle of the CA that signed the Vault server certificate. Needed
      # only for a private CA.
      caCert: ""

      # Per-request timeout, e.g. "30s". When empty, 30s is used.
      timeout: ""

      # How Hush AGW authenticates to Vault.
      auth:
        # - kubernetes: the pod's service account token, validated by Vault
        #   calling the cluster's TokenReview API. Needs Vault to reach it.
        # - jwt: the same token, whose signature Vault verifies against the
        #   cluster's public keys, set on its jwt auth mount as static keys or as
        #   the cluster's OIDC discovery or JWKS URL.
        # - token: a token supplied here. Nothing renews it; for testing.
        method: "kubernetes"

        # The auth mount to log in against. When empty, the method's
        # conventional path is used: "kubernetes" or "jwt".
        mount: ""

        # The Vault role to log in as. Required for the kubernetes and jwt
        # methods. It must bind this chart's service account and namespace, and
        # grant at least:
        #
        #   path "<mount>/data/<prefix>/*"     { capabilities = ["create", "update", "read"] }
        #   path "<mount>/metadata/<prefix>/*" { capabilities = ["read", "delete"] }
        role: ""

        # Audience to request in the projected service account token, for the
        # kubernetes and jwt methods. It must be an audience the Vault role
        # binds. When empty, the token carries the cluster's default audience.
        audience: ""

        # A Vault token, for the token method; testing only. Mutually exclusive
        # with 'tokenSecretRef'.
        token: ""

        # A pre-existing Kubernetes Secret holding the Vault token, for the
        # token method. Keeps the token out of the release manifest.
        tokenSecretRef:
          # Name of the Secret, in the namespace the chart is installed in.
          name: ""
          # Key within the Secret.
          key: ""

    # Azure Key Vault secret store configuration (used by az_key_vault)
    azKeyVault:
      # The vault URL, e.g. "https://acme.vault.azure.net". Required, and must
      # be https.
      vaultUrl: ""

      # The Azure cloud the vault and its authority live in: "public" (the
      # default), "china" or "usgov". It selects the Entra ID authority as well
      # as the data plane audience, so it cannot be inferred from the URL.
      cloud: ""

      # Timeout for one attempt, e.g. "30s". When empty, 30s is used. The SDK
      # retries on top of it, so an operation can take a few multiples.
      timeout: ""

      # The vault must not have purge protection enabled. A deleted Key Vault
      # secret keeps its name reserved until it is purged, so Hush AGW purges
      # every key it deletes, and the delete fails when the purge is refused.
      #
      # The identity below needs four permissions on the vault's secrets, and
      # the two permission models line up one for one:
      #
      #   Azure RBAC data action                                access policy
      #   Microsoft.KeyVault/vaults/secrets/getSecret/action     get
      #   Microsoft.KeyVault/vaults/secrets/setSecret/action     set
      #   Microsoft.KeyVault/vaults/secrets/delete               delete
      #   Microsoft.KeyVault/vaults/secrets/purge/action         purge
      #
      # "Key Vault Secrets Officer" is a superset that works in either model.
      # Omitting 'purge' has the same effect as purge protection.
      auth:
        # How Hush AGW authenticates to Key Vault:
        #   default        the pod's own identity. On AKS that is workload
        #                  identity, which needs
        #                  'agw.workloadIdentity.azure.clientId' set -- this
        #                  chart then labels the pod and annotates the service
        #                  account, and Azure's webhook injects the token and the
        #                  environment the SDK reads. Nothing secret is
        #                  configured here.
        #   client_secret  a service principal, for a cluster without workload
        #                  identity.
        method: "default"

        # The Entra ID tenant, for the "client_secret" method only. "default"
        # refuses one: the workload identity webhook sets AZURE_TENANT_ID.
        tenantId: ""

        # The service principal's application id, for the client_secret method.
        # The default method takes none: a user-assigned managed identity is
        # pinned through 'agw.workloadIdentity.azure.clientId', which reaches the
        # SDK as AZURE_CLIENT_ID, and a client id here is refused rather than
        # silently ignored.
        clientId: ""

        # The client secret, for the client_secret method; testing only.
        # Mutually exclusive with 'clientSecretRef'.
        clientSecret: ""

        # A pre-existing Kubernetes Secret holding the client secret, for the
        # client_secret method. Keeps it out of the release manifest.
        clientSecretRef:
          # Name of the Secret, in the namespace the chart is installed in.
          name: ""
          # Key within the Secret.
          key: ""

  # Pod security context. fsGroup 33 (www-data) makes the data volume writable by
  # Hush AGW.
  podSecurityContext:
    fsGroup: 33

  # Termination grace period.
  terminationGracePeriodSeconds: 30

  # Default resource requests/limits for the agw-controller and its init
  # container. With an emptyDir data volume the ephemeral-storage request must
  # be at least 'agw.dataVolume.size', and the ephemeral-storage limits of
  # agw-controller, agw-agentgateway, agw-vector and agw-genai-toolbox must add
  # up to more than it.
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi

  # Default resource requests/limits for the agw-agentgateway container.
  agentgateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi

  # Default resource requests/limits for the agw-vector container.
  vector:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 1Gi

  # The agw-genai-toolbox container.
  genaiToolbox:
    # Size of the in-memory volume holding the rendered toolbox config and
    # the mongodb CA files warden writes beside it.
    configSizeLimit: 16Mi

    # Default resource requests/limits.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 1Gi
