# Default values for hush-agw.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""

# This is to override the chart fullname.
fullnameOverride: ""

# Override the namespace used for all objects.
# If not specified '.Release.Namespace' is used.
namespaceOverride: ""

# Labels applied to all resources.
# For more information see
# https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
commonLabels: {}

# Hush deployment configuration
hushDeployment:
  # Authentication mode for Hush API token exchange.
  # Allowed values:
  # - password - use deployment password (default)
  # - oidc - use K8S SA token (oidc_provider must be configured in deployment)
  authMode: "password"

  # OIDC authentication settings. Used only when 'hushDeployment.authMode' is "oidc".
  oidc:
    # Audience ('aud' claim) requested for the projected K8S service account
    # token sent as the OIDC assertion. It must match the audience configured in
    # the deployment's oidc_provider.
    #
    # Empty (the default) requests no explicit audience, keeping the cluster
    # default for backward compatibility. On EKS the platform default is
    # "https://kubernetes.default.svc".
    audience: ""

  # The deployment token as received from API/UI.
  # When 'hushDeployment.secretKeyRef.{name,tokenKey}' are defined this value is ignored.
  # Otherwise the hush-sensor deployment secret is used.
  token: ""

  # The deployment password as received from API/UI.
  # Only used when 'hushDeployment.authMode' is "password"; ignored when
  # 'hushDeployment.secretKeyRef.{name,key}' are defined.
  # Otherwise the hush-sensor deployment secret is used.
  password: ""

  # A reference to an existing Secret with deployment password and token.
  #
  # The secret must be defined in the same namespace where the chart is installed.
  #
  # If deployment token is stored this way updating its value in the Secret
  # must be followed by chart recompilation (helm upgrade/template) or
  # fresh installation (helm install).
  secretKeyRef:
    # Secret name
    name: ""

    # Password secret key
    # Only used when 'hushDeployment.authMode' is "password".
    # If 'hushDeployment.password' is defined this value is ignored.
    key: ""

    # Token secret key
    # If 'hushDeployment.token' is defined this value is ignored.
    tokenKey: ""

  # Name of K8S Secret created by hush-sensor deployment
  sensorDeploymentSecretName: hush-sensor-deploymentsecret

# Values related to Hush Security container images
image:
  # Image pull token contains registry information and credentials
  pullToken: ""

  # Container registry to pull images from
  #
  # This value is ignored when 'image.pullToken' is defined.
  registry: hushsecurity.azurecr.io

  # Overrides the image tag for all gateway images.
  #
  # When not defined '.Chart.appVersion' is used. Ensure compatibility when overriding.
  tag: ""

  # Image repository for the agw-controller container.
  controllerRepository: agw-controller

  # Image repository for the agw-agentgateway container.
  agentgatewayRepository: agw-agentgateway

  # Image repository for the agw-vector container.
  vectorRepository: agw-vector

  # Image repository for the agw-genai-toolbox container.
  genaiToolboxRepository: agw-genai-toolbox

  # A list of pre-created image pull secrets of the form:
  #
  # pullSecretList:
  #   - name: "<secret-name-here>"
  #
  # Secrets must be pre-created in the same namespace where the chart is installed.
  #
  # When this list is empty 'image.pullSecret' can be used to create a secret
  # automatically.
  #
  # More information can be found here:
  # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecretList: []

  # Creates a Secret for pulling images
  #
  # When 'image.pullToken' is defined the credentials for the Secret are taken
  # from there. Otherwise both 'username' and 'password' must be defined.
  #
  # When 'image.pullSecretList' is non-empty the created secret is not used.
  pullSecret:
    # Custom pull secret name.
    # When not defined chart's full name is used with '-imagepullsecret' suffix.
    name: ""

    # Pull secret username
    #
    # This value is ignored when 'image.pullToken' is defined.
    username: ""

    # Pull secret password
    #
    # This value is ignored when 'image.pullToken' is defined.
    password: ""

  # Name of image pull secret created by the hush-sensor chart, used as a
  # fallback when none is created here (co-install scenario).
  sensorImagePullSecretName: hush-sensor-imagepullsecret

  # The pull policy for images.
  pullPolicy: Always

# Secret store the gateway keeps the private halves of its access manager keys
# in. The same settings as hush-am's 'secretStore'.
#
# A gateway that shares its Hush deployment with hush-am must use hush-am's
# secret store: the same kind, prefix and location. Either of them may create
# the deployment's next key, and the other reads it from there.
secretStore:
  # The secret store kind
  # Allowed values are:
  # - awssm: AWS Secrets Manager
  # - awsssm: AWS SSM Parameter Store
  # - gcpsm: GCP Secret Manager
  # - kubesecrets: K8S Secrets
  # - hc_vault: HashiCorp Vault KV v2
  kind: "kubesecrets"

  # A prefix used to distinguish the secrets the gateway creates, and to place
  # them under a path of your choosing. At most 80 characters, lowercase,
  # starting and ending with a letter or digit, and fixed once secrets exist
  # under it. An invalid prefix fails the install. '.' may not repeat.
  #
  #   kind         punctuation      notes
  #   awssm        - _ . + = @ /
  #   awsssm       - _ . /          at most 9 '/'-separated segments in the
  #                                 prefix; may not start with "aws" or "ssm"
  #   gcpsm        - _
  #   kubesecrets  - .              a Kubernetes Secret name
  #   hc_vault     - _ . /          a KV v2 path under the mount
  #
  # Check the gateway's credential before choosing a prefix outside the path it
  # was provisioned with -- for AWS an IRSA policy naming 'secret:<prefix>/*'
  # -- or the gateway installs and then fails every write.
  prefix: "hush"

  # AWS secret store configuration (used by awssm and awsssm)
  aws:
    # AWS access key (not recommended in production environments; used for testing)
    access_key:
      # AWS_SECRET_ACCESS_KEY value
      secret_access_key: ""
      # AWS_ACCESS_KEY_ID value
      access_key_id: ""
      # AWS_SESSION_TOKEN value (for temporary credentials)
      session_token: ""

    # AWS region name, e.g. "us-east-1"
    region: ""

    # Optional customer-managed KMS key used to encrypt the secret values.
    #
    # Accepts a KMS key ID, key ARN, alias name, or alias ARN. When empty, AWS
    # uses the default account-managed key: aws/secretsmanager for 'awssm',
    # aws/ssm for 'awsssm'. The KMS permissions it needs are listed beside
    # hush-am's 'secretStore.aws.kmsKeyId'.
    kmsKeyId: ""

  # GCP secret store configuration (used by gcpsm)
  gcp:
    # GCP project ID
    projectId: ""

    # GCP service account key JSON (not recommended in production environments; used for testing)
    #
    # For more information see:
    # https://cloud.google.com/iam/docs/keys-create-delete
    credentials_json: ""

  # Kubernetes secret store configuration
  k8s:
    # K8S namespace to store secrets in. It must already exist.
    # If not specified, the namespace where the chart is installed is used.
    namespace: ""

  # HashiCorp Vault secret store configuration (used by hc_vault)
  hcVault:
    # Vault address, e.g. "https://vault.example.com:8200". Must be https: a
    # login and every request afterwards carry a credential.
    address: ""

    # The KV version 2 mount to store secrets in. When empty, "secret" is used.
    # It must exist and be version 2; version 1 is refused at startup.
    mount: ""

    # Vault Enterprise namespace the mount lives in, e.g. "admin/team-a".
    # Leave empty on Vault Community Edition, which has no namespaces.
    namespace: ""

    # PEM bundle of the CA that signed the Vault server certificate. Needed
    # only for a private CA.
    caCert: ""

    # Per-request timeout, e.g. "30s". When empty, 30s is used.
    timeout: ""

    # How the gateway authenticates to Vault.
    auth:
      # - kubernetes: the pod's service account token, validated by Vault
      #   calling the cluster's TokenReview API. Needs Vault to reach it.
      # - jwt: the same token, whose signature Vault verifies against the
      #   cluster's public keys, set on its jwt auth mount as static keys or as
      #   the cluster's OIDC discovery or JWKS URL.
      # - token: a token supplied here. Nothing renews it; for testing.
      method: "kubernetes"

      # The auth mount to log in against. When empty, the method's
      # conventional path is used: "kubernetes" or "jwt".
      mount: ""

      # The Vault role to log in as. Required for the kubernetes and jwt
      # methods. It must bind this chart's service account and namespace, and
      # grant at least:
      #
      #   path "<mount>/data/<prefix>/*"     { capabilities = ["create", "update", "read"] }
      #   path "<mount>/metadata/<prefix>/*" { capabilities = ["read", "delete"] }
      role: ""

      # Audience to request in the projected service account token, for the
      # kubernetes and jwt methods. It must be an audience the Vault role
      # binds. When empty, the token carries the cluster's default audience.
      audience: ""

      # A Vault token, for the token method; testing only. Mutually exclusive
      # with 'tokenSecretRef'.
      token: ""

      # A pre-existing Kubernetes Secret holding the Vault token, for the
      # token method. Keeps the token out of the release manifest.
      tokenSecretRef:
        # Name of the Secret, in the namespace the chart is installed in.
        name: ""
        # Key within the Secret.
        key: ""

# Agent gateway workload. All values specific to the agent gateway live here.
agw:
  # External hostname (FQDN) where clients and the OAuth browser flow reach the
  # gateway. Required.
  #
  # It must resolve to your ingress/load balancer, be reachable by clients'
  # browsers, and match the certificate your edge serves. TLS is terminated at
  # your ingress/load balancer, not by the gateway.
  #
  # It must also be exactly the hostname recorded on this deployment in Hush.
  # Nothing reconciles the two, and connecting an application fails while they
  # disagree.
  hostname: ""

  # How long an unconsented dynamic OAuth registration stays valid, in seconds.
  #
  # This must match the value configured in the Hush authorization server. Do not
  # change it unless Hush support instructs you to.
  dynamicOAuthRegistrationTTL: 3600

  # Persistence for the gateway's local state.
  #
  # Required for a production installation. The state cannot be recreated, so
  # losing the volume makes every user reconnect their applications.
  persistence:
    # Whether to use a PersistentVolumeClaim.
    #
    # When false the state is ephemeral and lost on every pod restart. Only use
    # that for a proof of concept or for testing.
    enabled: true

    # Size of the volume claim.
    size: 1Gi

    # Access modes for the volume claim.
    accessModes:
      - ReadWriteOnce

    # Storage class name. When empty the cluster default is used, so the cluster
    # must have a default StorageClass or the claim stays Pending and the pod
    # never starts.
    storageClassName: ""

    # Keep the volume claim when the release is uninstalled.
    #
    # The claim is left behind so a reinstall keeps the state, at the cost of an
    # orphaned claim to remove by hand once it is genuinely unwanted. Set this to
    # false to have the claim removed with the release, discarding the state.
    #
    # A kept claim is reused only by a reinstall under the same release name and
    # namespace. Under a different name the install fails until the claim is
    # removed or named in 'existingClaim'.
    #
    # Ignored when 'existingClaim' is set, since the chart does not own that
    # claim and never removes it.
    retainOnDelete: true

    # Use a pre-created claim instead of creating one. When set, the chart does
    # not create a PVC. Ignored when 'enabled' is false.
    existingClaim: ""

  # Custom priority class name.
  priorityClassName: ""

  # Custom node selector.
  nodeSelector: {}

  # A list of tolerations.
  tolerations: []

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
                  - arm64

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Annotations for the ServiceAccount (e.g. cloud workload-identity bindings).
  serviceAccount:
    annotations: {}

  # Pod security context. fsGroup 33 (www-data) makes the data volume writable by
  # the gateway.
  podSecurityContext:
    fsGroup: 33

  # Termination grace period.
  terminationGracePeriodSeconds: 30

  # Default resource requests/limits for the agw-controller and its init
  # container.
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi

  # Default resource requests/limits for the agw-agentgateway container.
  agentgateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi

  # Default resource requests/limits for the agw-vector container.
  vector:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 1Gi

  # The agw-genai-toolbox container.
  genaiToolbox:
    # Size of the in-memory volume holding the rendered toolbox config and
    # the mongodb CA files warden writes beside it.
    configSizeLimit: 16Mi

    # Default resource requests/limits.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 1Gi
