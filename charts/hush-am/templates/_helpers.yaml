  value: {{ include "hush-am.keyDbFilePath" . }}
- name: HUSH_AM_ACR_DB_PATH
  value: {{ include "hush-am.acrDbFilePath" . }}
- name: MUFASA_SPIRESERVER_UDS_PATH
  value: {{ include "hush-am.spireServerSocketPath" . }}
- name: SIMBA_BIND_ADDRESS
  value: {{ include "hush-am.accessManagerRestBindAddress" . | quote }}
- name: SIMBA_SPIRE_AGENT_SOCKET_PATH
  value: {{ include "hush-am.spireAgentSocketPath" . }}
- name: SIMBA_X509_CTX_WAIT_DURATION
  value: "-1s"
- name: SIMBA_X509_CTX_WAIT_STEP
  value: "10s"
- name: MUFASA_K8S_SERVICE_ACCOUNT
  value: {{ include "hush-am.accessManagerFullName" . }}
- name: MUFASA_K8S_AGENT_SERVICE_ACCOUNT
  value: {{ include "hush-am.spireAgentFullName" . }}
{{- end }}

{{/*
Access Manager Kind
*/}}
{{- define "hush-am.accessManagerKind" -}}
{{- $kind := and .Values.accessManager .Values.accessManager.kind -}}
{{- $validKinds := list "deployment" "statefulset" -}}
{{- if not (has $kind $validKinds) -}}
    {{- fail (printf "'accessManager.kind' must be one of %v" $validKinds) -}}
{{- end -}}
{{- $kind -}}
{{- end }}

{{/*
Access Manager Pod Anti-Affinity rule
*/}}
{{- define "hush-am.accessManagerAntiAffinity" -}}
requiredDuringSchedulingIgnoredDuringExecution:
  - topologyKey: kubernetes.io/hostname
    labelSelector:
      matchLabels: {{- include "hush-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: access-manager
{{- end }}

{{/*
Access Manager affinity rules
*/}}
{{- define "hush-am.accessManagerAffinity" -}}
{{- $custom := (and .Values.accessManager .Values.accessManager.affinity) -}}
{{- if not $custom -}}
  {{- $custom = dict -}}
{{- end -}}
{{- if not (hasKey $custom "podAntiAffinity") -}}
  {{- $_ := set $custom "podAntiAffinity" (include "hush-am.accessManagerAntiAffinity" . | fromYaml) -}}
{{- end -}}
{{- $custom | toYaml -}}
{{- end }}

{{/*
Access Manager topology spread constraints
*/}}
{{- define "hush-am.accessManagerTopologySpreadConstraints" -}}
{{- $type := .Values.accessManager.topologySpreadConstraints.type -}}
{{- $validTypes := list "none" "zones" "zones_nodes" "custom" -}}
{{- if not (has $type $validTypes) -}}
  {{- fail (printf "'accessManager.topologySpreadConstraints.type' must be one of %v" $validTypes) -}}
{{- end -}}
{{- $validWhenUnsatisfiable := list "ScheduleAnyway" "DoNotSchedule" -}}
{{- if not (has .Values.accessManager.topologySpreadConstraints.whenUnsatisfiable $validWhenUnsatisfiable) -}}
  {{- fail (printf "'accessManager.topologySpreadConstraints.whenUnsatisfiable' must be one of %v" $validWhenUnsatisfiable) -}}
{{- end -}}
{{- if eq $type "zones" -}}
{{ include "hush-am.topologySpreadZones" . }}
{{- else if eq $type "zones_nodes" -}}
{{ include "hush-am.topologySpreadZones" . }}
{{ include "hush-am.topologySpreadNodes" . }}
{{- else if eq $type "custom" -}}
{{- if not .Values.accessManager.topologySpreadConstraints.custom -}}
  {{- fail "'accessManager.topologySpreadConstraints.custom' must not be empty when type is \"custom\"" -}}
{{- end -}}
{{- .Values.accessManager.topologySpreadConstraints.custom | toYaml -}}
{{- end -}}
{{- end }}

{{- define "hush-am.topologySpreadZones" -}}
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: {{ .Values.accessManager.topologySpreadConstraints.whenUnsatisfiable }}
  labelSelector:
    matchLabels: {{- include "hush-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: access-manager
{{- end }}

{{- define "hush-am.topologySpreadNodes" -}}
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: {{ .Values.accessManager.topologySpreadConstraints.whenUnsatisfiable }}
  labelSelector:
    matchLabels: {{- include "hush-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: access-manager
{{- end }}

{{/*
Should access manager use host network?
*/}}
{{- define "hush-am.accessManagerHostNetwork" -}}
{{- if .Values.accessManager.forcePodNetwork -}}
false
{{- else -}}
  {{- $noAwsIdentity := empty (include "hush-am.awsIdentityConfigured" .) -}}
  {{- $noGcpSa := and (empty .Values.accessManager.workloadIdentity.gcp.sa) (empty .Values.containerRegistry.gcp.sa) -}}
  {{- $noAzureCid := and (empty .Values.accessManager.workloadIdentity.azure.clientId) (empty .Values.containerRegistry.azure.clientId) -}}
  {{- printf "%t" (and $noAwsIdentity $noGcpSa $noAzureCid) -}}
{{- end -}}
{{- end }}

{{/*
Access Manager DNS Policy
*/}}
{{- define "hush-am.accessManagerDnsPolicy" -}}
{{- $managerHostNetwork := include "hush-am.accessManagerHostNetwork" . -}}
{{- if eq $managerHostNetwork "true" -}}
ClusterFirstWithHostNet
{{- else -}}
ClusterFirst
{{- end -}}
{{- end }}

{{/*
Access Manager Priority Class Name
*/}}
{{- define "hush-am.accessManagerPriorityClassName" -}}
{{- if .Values.accessManager.priorityClassName -}}
  {{ .Values.accessManager.priorityClassName }}
{{- else -}}
  {{ include "hush-am.accessManagerFullName" . }}
{{- end -}}
{{- end }}

{{/*
Spire Agent Priority Class Name
*/}}
{{- define "hush-am.spireAgentPriorityClassName" -}}
{{- if .Values.spireAgent.priorityClassName -}}
  {{ .Values.spireAgent.priorityClassName }}
{{- else -}}
  {{ include "hush-am.spireAgentFullName" . }}
{{- end -}}
{{- end }}

{{/*
Should we create a ConfigMap for custom configurations?
*/}}
{{- define "hush-am.shouldCreateConfigMap" -}}
{{- if or .Values.accessManager.logConfig .Values.admissionController.logConfig .Values.diagnostics.logConfig -}}
true
{{- end -}}
{{- end }}

{{/*
Custom configurations' ConfigMap name
*/}}
{{- define "hush-am.configMapName" -}}
{{- printf "%s-config" (include "hush-common.fullName" .) | trunc 63 }}
{{- end }}

{{/*
Is valid spire log level?
*/}}
{{- define "hush-am.validateSpireLogLevel" -}}
{{- $validLevels := list "DEBUG" "INFO" "WARN" "ERROR" -}}
{{- if not (has .value $validLevels) -}}
    {{- fail (printf "'%s' must be one of %v" .name $validLevels) -}}
{{- end -}}
{{- end }}

{{/*
Admission controller injector failure strategy (validated; empty when unset)
*/}}
{{- define "hush-am.admissionControllerInjectorFailureStrategy" -}}
{{- with .Values.admissionController.injectorFailureStrategy -}}
{{- $valid := list "abort" "continue" -}}
{{- if not (has . $valid) -}}
{{- fail (printf "'admissionController.injectorFailureStrategy' must be one of %v" $valid) -}}
{{- end -}}
{{- . -}}
{{- end -}}
{{- end }}

{{/*
Spire Server custom log level
*/}}
{{- define "hush-am.spireServerLogLevel" -}}
{{- $spireServerLogLevel := .Values.spireServer.logLevel -}}
{{- if $spireServerLogLevel -}}
  {{- $ctx := dict "name" "spireServer.logLevel" "value" $spireServerLogLevel -}}
  {{- include "hush-am.validateSpireLogLevel" $ctx -}}
  {{- printf "%s" $spireServerLogLevel -}}
{{- end -}}
{{- end }}

{{/*
Spire Agent custom log level
*/}}
{{- define "hush-am.spireAgentLogLevel" -}}
{{- $spireAgentLogLevel := .Values.spireAgent.logLevel -}}
{{- if $spireAgentLogLevel -}}
  {{- $ctx := dict "name" "spireAgent.logLevel" "value" $spireAgentLogLevel -}}
  {{- include "hush-am.validateSpireLogLevel" $ctx -}}
  {{- printf "%s" $spireAgentLogLevel -}}
{{- end -}}
{{- end }}

{{/*
API Controller envs
*/}}
{{- define "hush-am.apiControllerEnvs" -}}
{{ include "hush-am.mandatoryEnvsWithPassword" . }}
- name: MUFASA_METADATA_DB_PATH
  value: {{ include "hush-am.metadataDbFilePath" . }}
{{- end }}
