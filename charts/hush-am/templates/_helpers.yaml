{{/*
Mutating webhook namespaceSelector
*/}}
{{- define "hush-am.mutatingWebhookNamespaceSelector" -}}
{{- $type := .Values.admissionController.namespaceSelector.type -}}
{{- $validTypes := list "none" "names" "not_names" "custom" -}}
{{- if not (has $type $validTypes) -}}
  {{- fail (printf "'admissionController.namespaceSelector.type' must be one of %v" $validTypes) -}}
{{- end -}}
{{- if or (eq $type "names") (eq $type "not_names") -}}
matchExpressions:
  - key: kubernetes.io/metadata.name
    operator: {{ if eq $type "names" }}In{{ else }}NotIn{{ end }}
    values: {{- include "hush-am.mutatingWebhookNamespaceSelectorNamespaceNames" . | nindent 6 }}
{{- else if eq $type "custom" -}}
{{- if not .Values.admissionController.namespaceSelector.custom -}}
  {{- fail "'admissionController.namespaceSelector.custom' must not be empty when type is \"custom\"" -}}
{{- end -}}
{{- .Values.admissionController.namespaceSelector.custom | toYaml -}}
{{- end -}}
{{- end }}

{{/*
Access Manager Pod labels.

Emitted as YAML so that a caller can also read them back with fromYaml, which is
how the failurePolicy guard decides whether a selector would match this Pod.
*/}}
{{- define "hush-am.accessManagerPodLabels" -}}
{{ include "hush-common.labels" . }}
app.kubernetes.io/component: access-manager
{{- with (include "hush-common.azureWorkloadIdentityPodLabel" (include "hush-am.workloadIdentityContext" . | fromYaml)) }}
{{ . }}
{{- end }}
{{- end }}

{{/*
Mutating webhook namespaceSelector namespace names.

The release namespace is appended for "not_names", so that the webhook is never
invoked on the access manager's own pods.
*/}}
{{- define "hush-am.mutatingWebhookNamespaceSelectorNamespaceNames" -}}
{{- if not .Values.admissionController.namespaceSelector.names -}}
  {{- fail "'admissionController.namespaceSelector.names' must not be empty when type is \"names\" or \"not_names\"" -}}
{{- end -}}
{{- $names := .Values.admissionController.namespaceSelector.names -}}
{{- if eq .Values.admissionController.namespaceSelector.type "not_names" -}}
  {{- $ns := include "hush-common.namespace" . -}}
  {{- if not (has $ns $names) -}}
    {{- $names = append $names $ns -}}
  {{- end -}}
{{- end -}}
{{- $names | toYaml -}}
{{- end }}

{{/*
Mutating webhook objectSelector
*/}}
{{- define "hush-am.mutatingWebhookObjectSelector" -}}
{{- $type := .Values.admissionController.objectSelector.type -}}
{{- $validTypes := list "none" "labels" "not_labels" "custom" -}}
{{- if not (has $type $validTypes) -}}
  {{- fail (printf "'admissionController.objectSelector.type' must be one of %v" $validTypes) -}}
{{- end -}}
{{- if eq $type "labels" -}}
{{- if not .Values.admissionController.objectSelector.labels -}}
  {{- fail "'admissionController.objectSelector.labels' must not be empty when type is \"labels\"" -}}
{{- end -}}
matchLabels: {{- .Values.admissionController.objectSelector.labels | toYaml | nindent 2 }}
{{- else if eq $type "not_labels" -}}
{{- if not .Values.admissionController.objectSelector.labels -}}
  {{- fail "'admissionController.objectSelector.labels' must not be empty when type is \"not_labels\"" -}}
{{- end -}}
matchExpressions:
{{- range $key, $_ := .Values.admissionController.objectSelector.labels }}
  - key: {{ $key }}
    operator: DoesNotExist
{{- end }}
{{- else if eq $type "custom" -}}
{{- if not .Values.admissionController.objectSelector.custom -}}
  {{- fail "'admissionController.objectSelector.custom' must not be empty when type is \"custom\"" -}}
{{- end -}}
{{- .Values.admissionController.objectSelector.custom | toYaml -}}
{{- end -}}
{{- end }}

{{/*
Mutating webhook failurePolicy
*/}}
{{- define "hush-am.mutatingWebhookFailurePolicy" -}}
{{- $policy := .Values.admissionController.failurePolicy | default "Ignore" -}}
{{- $validPolicies := list "Ignore" "Fail" -}}
{{- if not (has $policy $validPolicies) -}}
  {{- fail (printf "'admissionController.failurePolicy' must be one of %v" $validPolicies) -}}
{{- end -}}
{{- if eq $policy "Fail" -}}
  {{- $_ := include "hush-am.mutatingWebhookNamespaceSelector" . -}}
  {{- $_ = include "hush-am.mutatingWebhookObjectSelector" . -}}
  {{- $ns := include "hush-common.namespace" . -}}
  {{- $nsType := .Values.admissionController.namespaceSelector.type -}}
  {{- $objType := .Values.admissionController.objectSelector.type -}}
  {{- $safe := false -}}
  {{- if eq $nsType "custom" -}}
    {{- $safe = true -}}
  {{- else if or (eq $nsType "names") (eq $nsType "not_names") -}}
    {{- $names := include "hush-am.mutatingWebhookNamespaceSelectorNamespaceNames" . | fromYamlArray -}}
    {{- if eq $nsType "not_names" -}}
      {{- $safe = has $ns $names -}}
    {{- else -}}
      {{- $safe = not (has $ns $names) -}}
    {{- end -}}
  {{- end -}}
  {{- if eq $objType "custom" -}}
    {{- $safe = true -}}
  {{- else if eq $objType "labels" -}}
    {{- $managerLabels := fromYaml (include "hush-am.accessManagerPodLabels" .) -}}
    {{- $selectsManager := true -}}
    {{- range $key, $value := .Values.admissionController.objectSelector.labels -}}
      {{- if not (hasKey $managerLabels $key) -}}
        {{- $selectsManager = false -}}
      {{- else if ne (printf "%v" (get $managerLabels $key)) (printf "%v" $value) -}}
        {{- $selectsManager = false -}}
      {{- end -}}
    {{- end -}}
    {{- if not $selectsManager -}}
      {{- $safe = true -}}
    {{- end -}}
  {{- end -}}
  {{- if not $safe -}}
    {{- fail (printf "'admissionController.failurePolicy: Fail' would let the webhook be invoked on the access manager's own pod in namespace %q, whose creation it would then reject, so the release could not start. Keep that pod out of the webhook's scope: set 'admissionController.namespaceSelector.type' to \"not_names\", or to \"names\" without %q, or set an 'admissionController.objectSelector' of type \"labels\" whose labels the access manager's pod does not carry. A \"custom\" selector of either kind is taken as deliberate and is not checked." $ns $ns) -}}
  {{- end -}}
{{- end -}}
{{- $policy -}}
{{- end }}

{{/*
Is K8S Silo using self namespace to store secrets?
*/}}
{{- define "hush-am.kubeSiloUsesSelfNamespace" -}}
{{- $namespace := include "hush-common.namespace" . -}}
{{- $kubeSiloNamespace := .Values.secretStore.k8s.namespace -}}
{{- if or (not $kubeSiloNamespace) (eq $namespace $kubeSiloNamespace) -}}
true
{{- end -}}
{{- end }}

{{/*
Namespaces (space-separated) needing a scoped RoleBinding for k8s secret
writes: the configured additional namespaces plus the k8s Silo namespace
when it is not the install namespace. The install namespace is already
covered by the access-manager Role, so it is dropped.
*/}}
{{- define "hush-am.secretWriteNamespaces" -}}
{{- $namespaces := .Values.secretStore.k8s.additionalNamespaces | default list -}}
{{- if not (include "hush-am.kubeSiloUsesSelfNamespace" .) -}}
  {{- $namespaces = concat $namespaces (list (include "hush-common.kubeSiloNamespace" (dict "store" .Values.secretStore "path" "secretStore" "root" .))) -}}
{{- end -}}
{{- $namespaces = without ($namespaces | uniq) (include "hush-common.namespace" .) -}}
{{- $namespaces | join " " -}}
{{- end }}

{{/*
Which address the admission controller should bind to?
*/}}
{{- define "hush-am.admissionControllerBindAddress" -}}
{{- printf ":%d" (int64 .Values.admissionController.port) -}}
{{- end }}

{{/*
The access manager's workload identity, in the context the hush-common helpers
take: the deprecated 'secretStore.aws.irsa' and the 'containerRegistry'
identities fill what 'accessManager.workloadIdentity' leaves empty.
*/}}
{{- define "hush-am.workloadIdentityContext" -}}
{{- $wi := .Values.accessManager.workloadIdentity -}}
{{- if not $wi.aws.irsa -}}
  {{- $secretStoreIrsa := .Values.secretStore.aws.irsa -}}
  {{- $crIrsa := .Values.containerRegistry.aws.irsa -}}
  {{- if and $secretStoreIrsa $crIrsa -}}
      {{- if ne $secretStoreIrsa $crIrsa -}}
          {{- fail "'secretStore.aws.irsa' and 'containerRegistry.aws.irsa' must be equal when both are defined" -}}
      {{- end -}}
  {{- end -}}
{{- end -}}
{{- $identity := dict
    "aws" (dict
        "irsa" (or $wi.aws.irsa .Values.secretStore.aws.irsa .Values.containerRegistry.aws.irsa)
        "oidc" ($wi.aws.oidc | default dict))
    "gcp" (dict "sa" (or $wi.gcp.sa .Values.containerRegistry.gcp.sa))
    "azure" (dict "clientId" (or $wi.azure.clientId .Values.containerRegistry.azure.clientId)) -}}
{{- include "hush-common.workloadIdentityContext" (dict
    "identity" $identity
    "path" "accessManager.workloadIdentity"
    "irsaPaths" (list "accessManager.workloadIdentity.aws.irsa" "secretStore.aws.irsa" "containerRegistry.aws.irsa")
    "secretStore" (dict "store" .Values.secretStore "path" "secretStore")) -}}
{{- end }}

{{/*
Is an AWS identity configured for the access manager or the container registry?
*/}}
{{- define "hush-am.awsIdentityConfigured" -}}
{{- $oidcRole := include "hush-common.awsOidcRole" (include "hush-am.workloadIdentityContext" . | fromYaml) -}}
{{- if or .Values.accessManager.workloadIdentity.aws.irsa $oidcRole .Values.containerRegistry.aws.irsa -}}
true
{{- end -}}
{{- end }}

{{/*
Admission-controller mode of AWS Config for Container Registry access
*/}}
{{- define "hush-am.admissionControllerAwcEcrCfgMode" -}}
{{- $awsIdentity := include "hush-am.awsIdentityConfigured" . -}}
{{- if or $awsIdentity .Values.accessManager.forcePodNetwork -}}
default
{{- else -}}
ec2role
{{- end -}}
{{- end }}

