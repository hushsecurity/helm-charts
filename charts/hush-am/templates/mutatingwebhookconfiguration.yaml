---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "hush-am.mutatingWebhookFullName" . }}
  labels: {{- include "hush-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: mutating-webhook
  namespace: {{ include "hush-common.namespace" . }}
webhooks:
  - name: {{ include "hush-am.mutatingWebhookFqdn" . }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    reinvocationPolicy: Never
    failurePolicy: {{ include "hush-am.mutatingWebhookFailurePolicy" . }}
    timeoutSeconds: {{ .Values.admissionController.mutatingWebhookTimeout }}
    clientConfig:
      # caBundle is written at runtime by the admission controller, not rendered
      # here, so a chart apply never clears the CA it publishes.
      service:
        namespace: {{ include "hush-common.namespace" . }}
        name: {{ include "hush-am.accessManagerFullName" . }}
        path: /
        port: {{ .Values.admissionController.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    {{- with (include "hush-am.mutatingWebhookNamespaceSelector" .) }}
    namespaceSelector: {{- . | nindent 6 }}
    {{- end }}
    {{- with (include "hush-am.mutatingWebhookObjectSelector" .) }}
    objectSelector: {{- . | nindent 6 }}
    {{- end }}
  {{- if .Values.diagnostics.enabled }}
  - name: {{ include "hush-am.mutatingWebhookHealthcheckFqdn" . }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    reinvocationPolicy: Never
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      # caBundle is written at runtime by the admission controller, not rendered
      # here, so a chart apply never clears the CA it publishes.
      service:
        namespace: {{ include "hush-common.namespace" . }}
        name: {{ include "hush-am.accessManagerFullName" . }}
        path: /
        port: {{ .Values.admissionController.port }}
    rules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["leases"]
        scope: "Namespaced"
    objectSelector:
      matchLabels:
        hush.security/diag-healthcheck: "true"
  {{- end }}
