{{/*
Name of the projected volume carrying the AWS web identity token
*/}}
{{- define "hush-common.awsWebIdentityVolumeName" -}}
aws-token-projection
{{- end }}

{{/*
Mount path of the projected volume carrying the AWS web identity token
*/}}
{{- define "hush-common.awsWebIdentityVolumePath" -}}
/var/run/secrets/hush.k8s.aws.projection
{{- end }}

{{/*
File name of the AWS web identity token
*/}}
{{- define "hush-common.awsWebIdentityTokenFileName" -}}
sa-token
{{- end }}

{{/*
Path of the AWS web identity token
*/}}
{{- define "hush-common.awsWebIdentityTokenPath" -}}
{{ include "hush-common.awsWebIdentityVolumePath" . }}/{{ include "hush-common.awsWebIdentityTokenFileName" . }}
{{- end }}

{{/*
Projected volume carrying the K8S SA token AWS STS exchanges for credentials.
Takes the workload identity context of _workloadidentity.yaml.
*/}}
{{- define "hush-common.awsWebIdentityVolume" -}}
{{- if include "hush-common.awsOidcRole" . -}}
- name: {{ include "hush-common.awsWebIdentityVolumeName" . }}
  projected:
    sources:
      - serviceAccountToken:
          path: {{ include "hush-common.awsWebIdentityTokenFileName" . }}
          audience: {{ include "hush-common.awsOidcAudience" . | quote }}
{{- end }}
{{- end }}

{{/*
Volume mount for the projected AWS web identity token.
Takes the workload identity context of _workloadidentity.yaml.
*/}}
{{- define "hush-common.awsWebIdentityVolumeMount" -}}
{{- if include "hush-common.awsOidcRole" . -}}
- name: {{ include "hush-common.awsWebIdentityVolumeName" . }}
  mountPath: {{ include "hush-common.awsWebIdentityVolumePath" . }}
  readOnly: true
{{- end }}
{{- end }}

{{/*
Envs directing the AWS SDK to assume a role with the projected K8S SA token.
Takes the workload identity context of _workloadidentity.yaml.
*/}}
{{- define "hush-common.awsWebIdentityEnvs" -}}
{{- with (include "hush-common.awsOidcRole" .) -}}
- name: AWS_ROLE_ARN
  value: {{ . | quote }}
- name: AWS_WEB_IDENTITY_TOKEN_FILE
  value: {{ include "hush-common.awsWebIdentityTokenPath" $ | quote }}
{{- end }}
{{- end }}
