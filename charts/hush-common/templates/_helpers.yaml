{{/*
Expand the name of the chart.
*/}}
{{- define "hush-common.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Build chart full name
*/}}
{{- define "hush-common.buildChartFullName" -}}
{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- if contains $name .Release.Name }}
    {{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
    {{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}

{{/*
Create a default fully qualified app name.
We truncate at 63 chars because some Kubernetes name fields are limited to this
(by the DNS naming spec). If release name contains chart name it will be used as a
full name.
*/}}
{{- define "hush-common.fullName" -}}
{{- if .Values.fullnameOverride }}
    {{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
    {{- include "hush-common.buildChartFullName" . }}
{{- end }}
{{- end }}

{{/*
Create chart name and version as used by the chart label.
*/}}
{{- define "hush-common.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version
    | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Calculate the namespace to use.
*/}}
{{- define "hush-common.namespace" -}}
{{- default .Release.Namespace .Values.namespaceOverride }}
{{- end }}

{{/*
Selector labels
*/}}
{{- define "hush-common.selectorLabels" -}}
app.kubernetes.io/name: {{ include "hush-common.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{/*
Common labels
*/}}
{{- define "hush-common.labels" -}}
helm.sh/chart: {{ include "hush-common.chart" . }}
{{ include "hush-common.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- with .Values.commonLabels -}}
    {{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}

{{/*
Pod template labels: stable across chart releases.
Excludes helm.sh/chart and app.kubernetes.io/version, which change on
every release and would needlessly restart pods of workloads whose spec
did not otherwise change.
*/}}
{{- define "hush-common.podLabels" -}}
{{ include "hush-common.selectorLabels" . }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- with .Values.commonLabels -}}
    {{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}

{{/*
b64dec with error check
*/}}
{{- define "hush-common.b64decode" -}}
{{- $decoded := b64dec .value -}}
{{- if contains "illegal base64" $decoded -}}
    {{- fail (printf "failed to base64 decode %s: %s" .name $decoded) -}}
{{- end -}}
{{- printf "%s" $decoded -}}
{{- end }}

{{/*
Deployment K8S Secret name
*/}}
{{- define "hush-common.deploymentKubeSecretName" -}}
{{- printf "%s-deploymentsecret" (include "hush-common.fullName" .) }}
{{- end }}

{{/*
Image tag to use: the explicit image.tag override, or the chart appVersion.
*/}}
{{- define "hush-common.imageTagOrAppVersion" -}}
{{- if and .Values.image .Values.image.tag -}}
  {{- .Values.image.tag -}}
{{- else -}}
  {{- .Chart.AppVersion -}}
{{- end -}}
{{- end }}

{{/*
Build image path from components
*/}}
{{- define "hush-common.buildImagePath" -}}
{{- if .registry -}}
    {{- printf "%s/%s:%s" .registry .repository .tag -}}
{{- else }}
    {{- printf "%s:%s" .repository .tag -}}
{{- end }}
{{- end }}

{{/*
Parse Hush image.pullToken
*/}}
{{- define "hush-common.parsePullToken" -}}
{{- $pullToken := and .Values.image .Values.image.pullToken -}}
{{- if $pullToken -}}
    {{- $ctx := dict "name" "image.pullToken" "value" $pullToken -}}
    {{- $token := (include "hush-common.b64decode" $ctx) -}}
    {{- $version := splitn ":" 2 $token -}}
    {{- if ne $version._0 "p1" -}}
        {{- fail (printf "image.pullToken version '%s' isn't supported" $version._0) -}}
    {{- end -}}
    {{- $registry := splitn ":" 2 $version._1 -}}
    {{- if not $registry._0 -}}
        {{- fail "invalid image.pullToken: registry is empty" -}}
    {{- end -}}
    {{- $username := splitn ":" 2 $registry._1 -}}
    {{- if not $username._0 -}}
        {{- fail "invalid image.pullToken: username is empty" -}}
    {{- end -}}
    {{- $password := splitn ":" 2 $username._1 -}}
    {{- if not $password._0 -}}
        {{- fail "invalid image.pullToken: password is empty" -}}
    {{- end -}}
    {{- dict
        "registry" $registry._0
        "username" $username._0
        "password" $password._0
        | toYaml
    -}}
{{- end -}}
{{- end }}

{{/*
Get image registry
*/}}
{{- define "hush-common.imageRegistry" -}}
{{- $token := (include "hush-common.parsePullToken" . | fromYaml) -}}
{{- $registry := and .Values.image .Values.image.registry -}}
{{- default $registry (get $token "registry") -}}
{{- end }}

{{/*
Get image.pullSecret.username
*/}}
{{- define "hush-common.kubeImagePullSecretUsername" -}}
{{- $token := (include "hush-common.parsePullToken" . | fromYaml) -}}
{{- $hasPullSecret := (and .Values.image .Values.image.pullSecret) -}}
{{- $username := and $hasPullSecret .Values.image.pullSecret.username -}}
{{- default $username (get $token "username") -}}
{{- end }}

{{/*
Get image.pullSecret.password
*/}}
{{- define "hush-common.kubeImagePullSecretPassword" -}}
{{- $token := (include "hush-common.parsePullToken" . | fromYaml) -}}
{{- $hasPullSecret := (and .Values.image .Values.image.pullSecret) -}}
{{- $password := and $hasPullSecret .Values.image.pullSecret.password -}}
{{- default $password (get $token "password") -}}
{{- end }}

{{/*
Should we create the K8S image pull secret?
*/}}
{{- define "hush-common.shouldCreateKubeImagePullSecret" -}}
{{- $username := (include "hush-common.kubeImagePullSecretUsername" .) -}}
{{- $password := (include "hush-common.kubeImagePullSecretPassword" .) -}}
{{- if and $username $password -}}
true
{{- end }}
{{- end }}

{{/*
K8S image pull secret name
*/}}
{{- define "hush-common.kubeImagePullSecretName" -}}
{{- $defaultPullSecretName :=
    (printf "%s-%s" (include "hush-common.fullName" .) "imagepullsecret") }}
{{- default $defaultPullSecretName .Values.image.pullSecret.name }}
{{- end }}

{{/*
The data to put in K8S image pull Secret
*/}}
{{- define "hush-common.kubeImagePullSecretData" -}}
{{- $msg := "couldn't find image registry definition. 'image.registry' or 'image.pullToken' must be defined." -}}
{{- $registry := required $msg (include "hush-common.imageRegistry" .) -}}
{{- $username := (include "hush-common.kubeImagePullSecretUsername" .) -}}
{{- $password := (include "hush-common.kubeImagePullSecretPassword" .) -}}
{{- $userPass := printf "%s:%s" $username $password -}}
{{- $value := printf "{\"auths\": {\"%s\": {\"auth\": \"%s\"}}}"
    $registry ($userPass | b64enc) -}}
{{- $value | b64enc }}
{{- end }}

{{/*
PullSecret effective list
*/}}
{{- define "hush-common.kubeImagePullSecretEffectiveList" -}}
    {{- if and .Values.image .Values.image.pullSecretList -}}
        {{- .Values.image.pullSecretList | toYaml }}
    {{- else -}}
        {{- if (include "hush-common.shouldCreateKubeImagePullSecret" .) -}}
- name: {{ include "hush-common.kubeImagePullSecretName" . | quote }}
        {{- end }}
    {{- end }}
{{- end }}

{{/*
PullSecret effective list, falling back to the sensor-created pull secret.
*/}}
{{- define "hush-common.kubeImagePullSecretEffectiveListWithSensorFallback" -}}
{{- with (include "hush-common.kubeImagePullSecretEffectiveList" .) -}}
  {{- . -}}
{{- else -}}
- name: {{ .Values.image.sensorImagePullSecretName | quote }}
{{- end }}
{{- end }}

{{/*
Which deployment-token secret to use, with fallback to the sensor deployment secret.
*/}}
{{- define "hush-common.effectiveDeploymentTokenKubeSecretRefWithSensorFallback" -}}
{{- if .Values.hushDeployment.token -}}
    {{- dict
        "name" (include "hush-common.deploymentKubeSecretName" .)
        "key" "deployment-token"
        | toYaml
    -}}
{{- else if and .Values.hushDeployment.secretKeyRef.name .Values.hushDeployment.secretKeyRef.tokenKey -}}
    {{- dict
        "name" .Values.hushDeployment.secretKeyRef.name
        "key" .Values.hushDeployment.secretKeyRef.tokenKey
        | toYaml
    -}}
{{- else -}}
    {{- dict
        "name" .Values.hushDeployment.sensorDeploymentSecretName
        "key" "deployment-token"
        | toYaml
    -}}
{{- end }}
{{- end }}

{{/*
Which deployment-password secret to use (password auth mode), with fallback to the sensor deployment secret.
*/}}
{{- define "hush-common.effectiveDeploymentPasswordKubeSecretRefWithSensorFallback" -}}
{{- if include "hush-common.isPasswordAuthMode" . -}}
  {{- if .Values.hushDeployment.password -}}
    {{- dict
        "name" (include "hush-common.deploymentKubeSecretName" .)
        "key" "deployment-password"
        | toYaml
    -}}
  {{- else if and .Values.hushDeployment.secretKeyRef.name .Values.hushDeployment.secretKeyRef.key -}}
    {{- dict
        "name" .Values.hushDeployment.secretKeyRef.name
        "key" .Values.hushDeployment.secretKeyRef.key
        | toYaml
    -}}
  {{- else -}}
    {{- dict
        "name" .Values.hushDeployment.sensorDeploymentSecretName
        "key" "deployment-password"
        | toYaml
    -}}
  {{- end }}
{{- end }}
{{- end }}

{{/*
The inline 'hushDeployment.token'; fails the render when it is empty. Call it
only when the chart's own Secret must hold the token, see
'hush-common.shouldCreateDeploymentTokenKubeSecret'.
*/}}
{{- define "hush-common.getDeploymentTokenValue" -}}
{{- $token := and .Values.hushDeployment .Values.hushDeployment.token -}}
{{- if not $token -}}
    {{- fail "'hushDeployment.token' is undefined" -}}
{{- end -}}
{{- printf "%s" $token -}}
{{- end }}

{{/*
The inline 'hushDeployment.password'; fails the render when it is empty. Call
it only when the chart's own Secret must hold the password, see
'hush-common.shouldCreateDeploymentPasswordKubeSecret'.
*/}}
{{- define "hush-common.getDeploymentPasswordValue" -}}
{{- $password := and .Values.hushDeployment .Values.hushDeployment.password -}}
{{- if not $password -}}
    {{- fail "'hushDeployment.password' is undefined" -}}
{{- end -}}
{{- printf "%s" $password -}}
{{- end }}

{{/*
Should the chart's own Secret hold the deployment token? Yes unless a
pre-created Secret names it.
*/}}
{{- define "hush-common.shouldCreateDeploymentTokenKubeSecret" -}}
{{- $keyRef := and .Values.hushDeployment .Values.hushDeployment.secretKeyRef -}}
{{- $name := and $keyRef $keyRef.name -}}
{{- $tokenKey := and $keyRef $keyRef.tokenKey -}}
{{- if not (and $name $tokenKey) -}}
true
{{- end }}
{{- end }}

{{/*
Should the chart's own Secret hold the deployment password? Yes in password
auth mode unless a pre-created Secret names it.
*/}}
{{- define "hush-common.shouldCreateDeploymentPasswordKubeSecret" -}}
{{- if include "hush-common.isPasswordAuthMode" . -}}
{{- $keyRef := and .Values.hushDeployment .Values.hushDeployment.secretKeyRef -}}
{{- $name := and $keyRef $keyRef.name -}}
{{- $key := and $keyRef $keyRef.key -}}
{{- if not (and $name $key) -}}
true
{{- end }}
{{- end }}
{{- end }}

{{/*
Should the chart create its own deployment Secret at all?
*/}}
{{- define "hush-common.shouldCreateDeploymentKubeSecret" -}}
{{- if or
    (include "hush-common.shouldCreateDeploymentTokenKubeSecret" .)
    (include "hush-common.shouldCreateDeploymentPasswordKubeSecret" .) -}}
true
{{- end -}}
{{- end }}

{{/*
Which deployment-token Secret the pod reads, resolved strictly: a pre-created
Secret ('hushDeployment.secretKeyRef'), else the chart's own Secret holding
the inline 'hushDeployment.token', which must then be set.
*/}}
{{- define "hush-common.effectiveDeploymentTokenKubeSecretRef" -}}
{{- if (include "hush-common.shouldCreateDeploymentTokenKubeSecret" .) -}}
    {{- dict
        "name" (include "hush-common.deploymentKubeSecretName" .)
        "key" "deployment-token"
        | toYaml
    -}}
{{- else -}}
    {{- dict
        "name" .Values.hushDeployment.secretKeyRef.name
        "key" .Values.hushDeployment.secretKeyRef.tokenKey
        | toYaml
    -}}
{{- end }}
{{- end }}

{{/*
Which deployment-password Secret the pod reads (password auth mode only),
resolved strictly like the token.
*/}}
{{- define "hush-common.effectiveDeploymentPasswordKubeSecretRef" -}}
{{- if include "hush-common.isPasswordAuthMode" . -}}
  {{- if (include "hush-common.shouldCreateDeploymentPasswordKubeSecret" .) -}}
      {{- dict
          "name" (include "hush-common.deploymentKubeSecretName" .)
          "key" "deployment-password"
          | toYaml
      -}}
  {{- else -}}
      {{- dict
          "name" .Values.hushDeployment.secretKeyRef.name
          "key" .Values.hushDeployment.secretKeyRef.key
          | toYaml
      -}}
  {{- end }}
{{- end }}
{{- end }}

{{/*
Pod annotations from a values entry that is a map, or a block string: the
string form was the only one the workload templates rendered before the map
handling was fixed, so it stays accepted. Use inside 'with'.
*/}}
{{- define "hush-common.annotations" -}}
{{- if kindIs "string" . -}}
{{ . | trim }}
{{- else -}}
{{ toYaml . }}
{{- end -}}
{{- end }}

{{/*
K8S secrets projection volume name
*/}}
{{- define "hush-common.k8sSecretsProjectionVolumeName" -}}
k8s-secrets-projection
{{- end }}

{{/*
K8S SA token mount path
*/}}
{{- define "hush-common.k8sSecretsProjectionVolumePath" -}}
/var/run/secrets/hush.k8s.projection
{{- end }}

{{/*
K8S SA token file name
*/}}
{{- define "hush-common.k8sSaTokenFileName" -}}
sa-token
{{- end }}

{{/*
K8S SA token path
*/}}
{{- define "hush-common.k8sSaTokenPath" -}}
{{ include "hush-common.k8sSecretsProjectionVolumePath" . }}/{{ include "hush-common.k8sSaTokenFileName" . }}
{{- end }}

{{/*
Audience requested for the K8S SA token projected as the OIDC assertion.
Empty by default, which keeps the cluster default audience.
*/}}
{{- define "hush-common.k8sSaTokenAudience" -}}
{{- dig "oidc" "audience" "" .Values.hushDeployment -}}
{{- end }}

{{/*
Projected SA token volume and its mount, each taking a dict of its values.
*/}}
{{- define "hush-common.saTokenProjectedVolume" -}}
- name: {{ .name }}
  projected:
    sources:
      - serviceAccountToken:
          path: {{ .fileName }}
          {{- with .audience }}
          audience: {{ . | quote }}
          {{- end }}
          {{- with .expirationSeconds }}
          expirationSeconds: {{ . }}
          {{- end }}
{{- end }}

{{- define "hush-common.saTokenVolumeMount" -}}
- name: {{ .name }}
  mountPath: {{ .mountPath }}
  readOnly: true
{{- end }}

{{/*
Empty volume masking the K8S SA token in a container that mounts it at the
token's path: Kubernetes does not mount the token into such a container.
*/}}
{{- define "hush-common.saTokenMaskVolumeName" -}}
sa-token-mask
{{- end }}

{{- define "hush-common.saTokenMaskVolume" -}}
- name: {{ include "hush-common.saTokenMaskVolumeName" . }}
  emptyDir: {}
{{- end }}

{{- define "hush-common.saTokenMaskVolumeMount" -}}
{{- include "hush-common.saTokenVolumeMount" (dict
    "name" (include "hush-common.saTokenMaskVolumeName" .)
    "mountPath" "/var/run/secrets/kubernetes.io/serviceaccount") -}}
{{- end }}

{{/*
Projected volume mounting the K8S SA token used as the Hush OIDC assertion.
*/}}
{{- define "hush-common.k8sSecretsProjectionVolume" -}}
{{- include "hush-common.saTokenProjectedVolume" (dict
    "name" (include "hush-common.k8sSecretsProjectionVolumeName" .)
    "fileName" (include "hush-common.k8sSaTokenFileName" .)
    "audience" (include "hush-common.k8sSaTokenAudience" .)) -}}
{{- end }}

{{/*
Volume mount for the projected K8S SA token.
*/}}
{{- define "hush-common.k8sSecretsProjectionVolumeMount" -}}
{{- include "hush-common.saTokenVolumeMount" (dict
    "name" (include "hush-common.k8sSecretsProjectionVolumeName" .)
    "mountPath" (include "hush-common.k8sSecretsProjectionVolumePath" .)) -}}
{{- end }}

{{/*
Validate auth mode value.
*/}}
{{- define "hush-common.validateAuthMode" -}}
{{- $mode := .Values.hushDeployment.authMode -}}
{{- if $mode -}}
  {{- $validModes := list "password" "oidc" -}}
  {{- if not (has $mode $validModes) -}}
    {{- fail (printf "'hushDeployment.authMode' must be one of %v, got %q" $validModes $mode) -}}
  {{- end -}}
{{- end -}}
{{- end }}

{{/*
Is the auth mode set to password (or unset, for backward compatibility)?
*/}}
{{- define "hush-common.isPasswordAuthMode" -}}
{{- include "hush-common.validateAuthMode" . -}}
{{- $mode := .Values.hushDeployment.authMode -}}
{{- if or (not $mode) (eq $mode "password") -}}
true
{{- end -}}
{{- end }}

{{/*
Verify an image tag against a minimum supported version. Takes a dict with
'valueName' (for the message), 'version' (the tag) and 'minVersion'.
Channel tags ('v0', 'rc0', 'v0.25', 'rc0.25') compare on the parts they carry;
a tag that is neither 'v' nor 'rc' prefixed (e.g. a commit SHA) is left alone.
*/}}
{{- define "hush-common.verifyMinimumSupportedVersion" -}}
{{- $msg := printf "Version %s in %s is below the minimum supported version %s" .version .valueName .minVersion -}}
{{- $version := trimPrefix "v" .version -}}
{{- $version = trimPrefix "rc" $version -}}
{{- $versionParts := splitList "." $version -}}
{{- $minVersionAtoms := semver .minVersion -}}
{{- if not (or (hasPrefix "v" .version) (hasPrefix "rc" .version)) -}}
    {{/* looks like unofficial version - skip verification */}}
{{- else if eq (len $versionParts) 1 -}}
    {{- $major := atoi (index $versionParts 0) -}}
    {{- if lt $major $minVersionAtoms.Major -}}
        {{- fail $msg -}}
    {{- end -}}
{{- else if eq (len $versionParts) 2 -}}
    {{- $major := atoi (index $versionParts 0) -}}
    {{- $minor := atoi (index $versionParts 1) -}}
    {{- if lt $major $minVersionAtoms.Major -}}
        {{- fail $msg -}}
    {{- else if and (eq $major $minVersionAtoms.Major) (lt $minor $minVersionAtoms.Minor) -}}
        {{- fail $msg -}}
    {{- end -}}
{{- else -}}
    {{- $minVer := semver .minVersion -}}
    {{- $ver := semver $version -}}
    {{- if eq ($ver | $minVer.Compare) 1 -}}
        {{- fail $msg -}}
    {{- end -}}
{{- end -}}
{{- end -}}

{{/*
Verify 'image.sensorTag' against the minimum the charts support for the
sensor images (sensor, sensor-vector, sentry, vermon).
*/}}
{{- define "hush-common.verifySensorMinimumSupportedVersion" -}}
{{- include "hush-common.verifyMinimumSupportedVersion" (dict
    "valueName" "'image.sensorTag'"
    "version" .Values.image.sensorTag
    "minVersion" "v0.25.0") -}}
{{- end -}}

{{/*
Verify 'image.connectorTag' against the minimum the charts support for the
connector images (connector-client, connector-forwarder).
*/}}
{{- define "hush-common.verifyConnectorMinimumSupportedVersion" -}}
{{- include "hush-common.verifyMinimumSupportedVersion" (dict
    "valueName" "'image.connectorTag'"
    "version" .Values.image.connectorTag
    "minVersion" "v0.5.0") -}}
{{- end -}}

{{/*
The environment that identifies a container to the platform as part of a
Kubernetes deployment, for a container that authenticates without the
deployment password: the SA token path, the auth mode, the deployment token
Secret reference and the deployment kind. The reference resolves through
'hush-common.effectiveDeploymentTokenKubeSecretRef'.
*/}}
{{- define "hush-common.deploymentIdentityEnvWithoutPassword" -}}
- name: HUSH_K8S_SA_TOKEN_PATH
  value: {{ include "hush-common.k8sSaTokenPath" . | quote }}
- name: HUSH_AUTH_MODE
  value: {{ .Values.hushDeployment.authMode | quote }}
{{- with (include "hush-common.effectiveDeploymentTokenKubeSecretRef" . | fromYaml) }}
- name: DEPLOYMENT_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
- name: DEPLOYMENT_KIND
  value: k8s
{{- end }}

{{/*
The full deployment identity environment: the entries above plus, in
password auth mode, the deployment password Secret reference, which resolves
through 'hush-common.effectiveDeploymentPasswordKubeSecretRef'.
*/}}
{{- define "hush-common.deploymentIdentityEnv" -}}
{{ include "hush-common.deploymentIdentityEnvWithoutPassword" . }}
{{- with (include "hush-common.effectiveDeploymentPasswordKubeSecretRef" . | fromYaml) }}
- name: DEPLOYMENT_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .name }}
      key: {{ .key }}
{{- end }}
{{- end }}

{{/*
OpenShift SCC assignment via RBAC: a RoleBinding of a service account to the
built-in 'system:openshift:scc:<scc>' ClusterRole (the declarative equivalent
of 'oc adm policy add-scc-to-user'). Takes a dict with 'root' (the chart
context), 'name' (the component's full name; the binding is named
'<name>-scc-<scc>'), 'scc' and 'serviceAccount'. The caller gates it on the
OpenShift API group and its own value.
*/}}
{{- define "hush-common.sccRoleBinding" -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-scc-{{ .scc }}
  labels: {{- include "hush-common.labels" .root | nindent 4 }}
  namespace: {{ include "hush-common.namespace" .root }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .scc }}
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ include "hush-common.namespace" .root }}
{{- end }}
