{{/*
Every helper here takes (dict "store" <secretStore values> "path" <their value
path> "root" $), so that a chart keeps the values where it wants and errors
name them where they are. siloEnvs also takes "azureClientIdPath", the value
the chart sets its Azure workload identity client id at.
*/}}
{{/*
Silo namespace prefix
*/}}
{{- define "hush-common.siloNamespacePrefix" -}}
{{- $prefix := and $.store $.store.prefix -}}
{{- $kind := and $.store $.store.kind -}}
{{/*
Per-kind prefix rules, mirroring the API's. The separator is its own
alternative so it never repeats, and the shape checks below run before the
pattern so each malformation names itself -- "." is checked there too, since
the patterns let a punctuation run repeat and "." is the one that may not, and
only for the kinds whose charset carries it, so a kind without "." reports the
charset instead. RE2: no lookaheads.

az_key_vault is the one kind whose backend limit binds the prefix: a Key Vault
secret name is 127 characters, and a maximum key plus the namespace leaves 32.
Its alphabet admits no punctuation but the separator, so it carries no "dot".
Both maxima mirror am's KindLimits.MaxUserPrefix, declared per kind there.
*/}}
{{- $maxPrefix := 80 -}}
{{- $rules := dict
    "awssm"        (dict "sep" "/" "pattern" "^[a-z0-9]+(([-_.+=@]+|/)[a-z0-9]+)*$" "max" $maxPrefix "dot" true)
    "awsssm"       (dict "sep" "/" "pattern" "^[a-z0-9]+(([-_.]+|/)[a-z0-9]+)*$"     "max" $maxPrefix "segments" 9 "reserved" (list "aws" "ssm") "dot" true)
    "gcpsm"        (dict "sep" "-" "pattern" "^[a-z0-9]+((_+|-)[a-z0-9]+)*$"         "max" $maxPrefix)
    "kubesecrets"  (dict "sep" "-" "pattern" "^[a-z0-9]+([-.][a-z0-9]+)*$"           "max" $maxPrefix "dot" true)
    "hc_vault"     (dict "sep" "/" "pattern" "^[a-z0-9]+(([-_.]+|/)[a-z0-9]+)*$"     "max" $maxPrefix "dot" true)
    "az_key_vault" (dict "sep" "-" "pattern" "^[a-z0-9]+(-[a-z0-9]+)*$"              "max" 32)
-}}
{{- $rule := get $rules (toString $kind) -}}
{{/* every caller is already inside a branch that rejects an unknown kind */}}
{{- if not $rule -}}
    {{- fail (printf "'%s.kind' is invalid: %s" $.path (toString $kind)) -}}
{{- end -}}
{{- $sep := get $rule "sep" -}}
{{- if hasPrefix $sep (toString $prefix) -}}
    {{- fail (printf "'%s.prefix' must not start with '%s' for kind %s" $.path $sep $kind) -}}
{{- end -}}
{{- if hasSuffix $sep (toString $prefix) -}}
    {{- fail (printf "'%s.prefix' must not end with '%s' for kind %s" $.path $sep $kind) -}}
{{- end -}}
{{- if contains (printf "%s%s" $sep $sep) (toString $prefix) -}}
    {{- fail (printf "'%s.prefix' must not repeat '%s' for kind %s" $.path $sep $kind) -}}
{{- end -}}
{{- if and (get $rule "dot") (contains ".." (toString $prefix)) -}}
    {{- fail (printf "'%s.prefix' must not repeat '.' for kind %s" $.path $kind) -}}
{{- end -}}
{{- if not (regexMatch (get $rule "pattern") (toString $prefix)) -}}
    {{- fail (printf "'%s.prefix' is invalid for kind %s: %s" $.path $kind (toString $prefix)) -}}
{{- end -}}
{{- if gt (len (toString $prefix)) (int (get $rule "max")) -}}
    {{- fail (printf "'%s.prefix' exceeds %d characters for kind %s" $.path (int (get $rule "max")) $kind) -}}
{{- end -}}
{{- $segments := get $rule "segments" -}}
{{- if $segments -}}
    {{- if gt (len (splitList "/" (toString $prefix))) (int $segments) -}}
        {{- fail (printf "'%s.prefix' exceeds %d '/'-separated segments for kind %s" $.path (int $segments) $kind) -}}
    {{- end -}}
{{- end -}}
{{- $reserved := get $rule "reserved" -}}
{{- if $reserved -}}
    {{- range $reserved -}}
        {{- if hasPrefix . (toString $prefix) -}}
            {{- fail (printf "'%s.prefix' must not start with '%s' for kind %s" $.path . $kind) -}}
        {{- end -}}
    {{- end -}}
{{- end -}}
{{ $prefix }}
{{- end }}

{{/*
Secret store AWS region
*/}}
{{- define "hush-common.siloAwsRegion" -}}
{{- $region := and (and $.store $.store.aws) $.store.aws.region -}}
{{- if not $region -}}
    {{- fail (printf "'%s.aws.region' must be defined for AWS secret store" $.path) -}}
{{- end -}}
{{ $region }}
{{- end }}

{{/*
GCP Secret Manager project
*/}}
{{- define "hush-common.siloGcpProject" -}}
{{- $project := and (and $.store $.store.gcp) $.store.gcp.projectId -}}
{{- if not $project -}}
    {{- fail (printf "'%s.gcp.projectId' must be defined for GCP secret store" $.path) -}}
{{- end -}}
{{ $project }}
{{- end }}

{{/*
Azure Key Vault URL
*/}}
{{- define "hush-common.azKeyVaultSiloVaultUrl" -}}
{{- $url := dig "azKeyVault" "vaultUrl" "" $.store -}}
{{- if not $url -}}
    {{- fail (printf "'%s.azKeyVault.vaultUrl' must be defined for the az_key_vault secret store" $.path) -}}
{{- end -}}
{{- if not (regexMatch "^https://[^/?#]+/?$" (lower $url)) -}}
    {{- fail (printf "'%s.azKeyVault.vaultUrl' must be an https URL naming a vault, with no path, query or fragment, got %q" $.path $url) -}}
{{- end -}}
{{ $url }}
{{- end }}

{{/*
How the access manager authenticates to Key Vault.

"default" needs nothing here: on AKS the identity comes from workload identity,
which the client id at "azureClientIdPath" turns on. "client_secret" needs a
client id and exactly one of the two secret forms.
*/}}
{{- define "hush-common.azKeyVaultSiloAuthMethod" -}}
{{- $method := dig "azKeyVault" "auth" "method" "default" $.store -}}
{{- if not (has $method (list "default" "client_secret")) -}}
    {{- fail (printf "'%s.azKeyVault.auth.method' is invalid: %s" $.path $method) -}}
{{- end -}}
{{- $clientId := dig "azKeyVault" "auth" "clientId" "" $.store -}}
{{- $secret := dig "azKeyVault" "auth" "clientSecret" "" $.store -}}
{{- $secretRef := dig "azKeyVault" "auth" "clientSecretRef" dict $.store -}}
{{- $tenantId := dig "azKeyVault" "auth" "tenantId" "" $.store -}}
{{- if eq $method "client_secret" -}}
    {{- if not $tenantId -}}
        {{- fail (printf "'%s.azKeyVault.auth.tenantId' must be defined for the client_secret method" $.path) -}}
    {{- end -}}
    {{- if not (regexMatch "^[A-Za-z0-9.-]+$" (toString $tenantId)) -}}
        {{- fail (printf "'%s.azKeyVault.auth.tenantId' must be letters, digits, '.' and '-', got %q" $.path $tenantId) -}}
    {{- end -}}
    {{- if not $clientId -}}
        {{- fail (printf "'%s.azKeyVault.auth.clientId' must be defined for the client_secret method" $.path) -}}
    {{- end -}}
    {{- if and (not $secret) (not (get $secretRef "name")) -}}
        {{- fail (printf "'%s.azKeyVault.auth.clientSecret' or '.clientSecretRef' must be defined for the client_secret method" $.path) -}}
    {{- end -}}
{{- else -}}
    {{- if $clientId -}}
        {{- fail (printf "'%s.azKeyVault.auth.clientId' is not used by the default method; set '%s'" $.path $.azureClientIdPath) -}}
    {{- end -}}
    {{- if $tenantId -}}
        {{- fail (printf "'%s.azKeyVault.auth.tenantId' is not used by the default method; the workload identity webhook sets AZURE_TENANT_ID" $.path) -}}
    {{- end -}}
{{- end -}}
{{ $method }}
{{- end }}

{{/*
HashiCorp Vault address. https is required: every request carries the Vault
token in a header, and a kubernetes or jwt login posts the pod's service
account token in the body, so plaintext would put a live credential on the
wire. The access manager allows plaintext on this path, where its own tests
talk to a dev-mode Vault; a chart install is not that, so it is refused here.
*/}}
{{- define "hush-common.hcVaultSiloAddress" -}}
{{- $address := dig "hcVault" "address" "" $.store -}}
{{- if not $address -}}
    {{- fail (printf "'%s.hcVault.address' must be defined for the hc_vault secret store" $.path) -}}
{{- end -}}
{{/* the scheme is matched lowercased and a host is required, so that this
     answers exactly as the access manager's url.Parse does: it lowercases the
     scheme itself, and refuses an empty host. */}}
{{- if not (regexMatch "^https://[^/]+" (lower $address)) -}}
    {{- fail (printf "'%s.hcVault.address' must be an https URL with a host, got %q" $.path $address) -}}
{{- end -}}
{{ $address }}
{{- end }}

{{- define "hush-common.hcVaultSiloMountPattern" -}}
^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$
{{- end }}

{{- define "hush-common.hcVaultSiloMount" -}}
{{- $mount := toString (dig "hcVault" "mount" "" $.store) -}}
{{- if and $mount (not (regexMatch (include "hush-common.hcVaultSiloMountPattern" .) $mount)) -}}
    {{- fail (printf "'%s.hcVault.mount' must be letters, digits, '-', '_' and '/', got %q" $.path $mount) -}}
{{- end -}}
{{ $mount }}
{{- end }}

{{/*
HashiCorp Vault request timeout, passed through: a chart cannot track
time.ParseDuration, so the access manager is what refuses a bad one.
*/}}
{{- define "hush-common.hcVaultSiloTimeout" -}}
{{ toString (dig "hcVault" "timeout" "" ($.store | default dict)) }}
{{- end }}

{{- define "hush-common.hcVaultSiloToken" -}}
{{- $auth := dig "hcVault" "auth" dict ($.store | default dict) -}}
{{- $secretRef := get $auth "tokenSecretRef" | default dict -}}
{{- if and (get $auth "token") (get $secretRef "name") -}}
    {{- fail (printf "'%s.hcVault.auth.token' and '%s.hcVault.auth.tokenSecretRef.name' are mutually exclusive" $.path $.path) -}}
{{- end -}}
{{- if get $secretRef "name" -}}
    {{- if not (get $secretRef "key") -}}
        {{- fail (printf "'%s.hcVault.auth.tokenSecretRef.key' must be defined beside 'tokenSecretRef.name'" $.path) -}}
    {{- end -}}
secretRef
{{- else if get $auth "token" -}}
value
{{- end -}}
{{- end }}

{{/*
HashiCorp Vault auth method, validated together with what it requires.

kubernetes and jwt are the same login request and differ only in how Vault
validates the service account token it is given: kubernetes asks the cluster's
TokenReview API, jwt checks the signature against keys it already holds. Both
need a role. token presents a token the environment holds and renews nothing,
so it is for testing rather than a deployment.
*/}}
{{- define "hush-common.hcVaultSiloAuthMethod" -}}
{{- $auth := dig "hcVault" "auth" dict $.store -}}
{{- $method := get $auth "method" | default "kubernetes" -}}
{{- $validMethods := list "kubernetes" "jwt" "token" -}}
{{- if not (has $method $validMethods) -}}
    {{- fail (printf "'%s.hcVault.auth.method' must be one of %v, got %q" $.path $validMethods $method) -}}
{{- end -}}
{{- if eq $method "token" -}}
    {{- if not (include "hush-common.hcVaultSiloToken" .) -}}
        {{- fail (printf "'%s.hcVault.auth.token' or '%s.hcVault.auth.tokenSecretRef' must be defined for the token auth method" $.path $.path) -}}
    {{- end -}}
    {{/* a field belonging to another method is refused rather than ignored,
         because the mistake it usually represents is naming the wrong one */}}
    {{- range $field := list "role" "mount" -}}
        {{- if get $auth $field -}}
            {{- fail (printf "'%s.hcVault.auth.%s' does not apply to the token auth method" $.path $field) -}}
        {{- end -}}
    {{- end -}}
{{- else -}}
    {{- if not (get $auth "role") -}}
        {{- fail (printf "'%s.hcVault.auth.role' must be defined for the %s auth method" $.path $method) -}}
    {{- end -}}
    {{- $mount := toString (get $auth "mount") -}}
    {{- if and $mount (not (regexMatch (include "hush-common.hcVaultSiloMountPattern" .) $mount)) -}}
        {{- fail (printf "'%s.hcVault.auth.mount' must be letters, digits, '-', '_' and '/', got %q" $.path $mount) -}}
    {{- end -}}
{{- end -}}
{{ $method }}
{{- end }}

{{- define "hush-common.hcVaultSiloUsesSaToken" -}}
{{- $store := $.store | default dict -}}
{{- $uses := dig "hcVault" "auth" "audience" "" $store -}}
{{- if eq (toString (get $store "kind")) "hc_vault" -}}
    {{- if ne (include "hush-common.hcVaultSiloAuthMethod" .) "token" -}}
        {{- $uses = true -}}
    {{- end -}}
{{- end -}}
{{- if $uses -}}
true
{{- end -}}
{{- end }}

{{/*
Volume name, mount path and file name of the service account token projected
for Vault. It is projected separately from the token the Hush OIDC assertion
uses: the audience a Vault role accepts is the operator's choice and has no
reason to match the one Hush issues against.
*/}}
{{- define "hush-common.hcVaultSiloSaTokenVolumeName" -}}
hc-vault-token-projection
{{- end }}

{{- define "hush-common.hcVaultSiloSaTokenVolumePath" -}}
/var/run/secrets/hush.k8s.hc_vault.projection
{{- end }}

{{- define "hush-common.hcVaultSiloSaTokenFileName" -}}
sa-token
{{- end }}

{{- define "hush-common.hcVaultSiloSaTokenPath" -}}
{{ include "hush-common.hcVaultSiloSaTokenVolumePath" . }}/{{ include "hush-common.hcVaultSiloSaTokenFileName" . }}
{{- end }}

{{- define "hush-common.hcVaultSiloSaTokenVolume" -}}
{{- if include "hush-common.hcVaultSiloUsesSaToken" . -}}
{{- include "hush-common.saTokenProjectedVolume" (dict
    "name" (include "hush-common.hcVaultSiloSaTokenVolumeName" .)
    "fileName" (include "hush-common.hcVaultSiloSaTokenFileName" .)
    "audience" (dig "hcVault" "auth" "audience" "" $.store)) -}}
{{- end -}}
{{- end }}

{{/*
Volume mount for the Vault service account token.
*/}}
{{- define "hush-common.hcVaultSiloSaTokenVolumeMount" -}}
{{- if include "hush-common.hcVaultSiloUsesSaToken" . -}}
{{- include "hush-common.saTokenVolumeMount" (dict
    "name" (include "hush-common.hcVaultSiloSaTokenVolumeName" .)
    "mountPath" (include "hush-common.hcVaultSiloSaTokenVolumePath" .)) -}}
{{- end -}}
{{- end }}

{{- define "hush-common.hcVaultSiloProcessEnvs" -}}
{{- $store := $.store | default dict -}}
{{- with (dig "hcVault" "caCert" "" $store) }}
- name: SILO_HC_VAULT_CA_CERT
  value: {{ . | quote }}
{{- end }}
{{- with (include "hush-common.hcVaultSiloTimeout" .) }}
- name: SILO_HC_VAULT_TIMEOUT
  value: {{ . | quote }}
{{- end }}
{{- $token := include "hush-common.hcVaultSiloToken" . }}
{{- if eq $token "secretRef" }}
    {{- $secretRef := dig "hcVault" "auth" "tokenSecretRef" dict $store }}
- name: SILO_HC_VAULT_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ get $secretRef "name" | quote }}
      key: {{ get $secretRef "key" | quote }}
{{- else if eq $token "value" }}
- name: SILO_HC_VAULT_TOKEN
  value: {{ dig "hcVault" "auth" "token" "" $store | quote }}
{{- end }}
{{- if include "hush-common.hcVaultSiloUsesSaToken" . }}
- name: SILO_HC_VAULT_SA_TOKEN_FILE
  value: {{ include "hush-common.hcVaultSiloSaTokenPath" . | quote }}
{{- end }}
{{- end }}

{{/*
Read by the access manager for every gcp_sm store it serves, including those
created through the Hush API, so emitted whatever 'secretStore.kind' is.
*/}}
{{- define "hush-common.gcpSmSiloProcessEnvs" -}}
{{- with (dig "gcp" "credentials_json" "" $.store) }}
- name: SILO_GCP_SM_CREDENTIALS_JSON
  value: {{ . | quote }}
{{- end }}
{{- end }}

{{/*
Azure Key Vault settings the access manager reads for every store it serves,
not only the one this chart configures: a store created through the Hush API
carries its own addressing but takes the client secret and the timeout from
the process. Emitted whatever 'secretStore.kind' is, as the vault ones are.
*/}}
{{- define "hush-common.azKeyVaultSiloProcessEnvs" -}}
{{- $store := $.store | default dict -}}
{{- with (dig "azKeyVault" "timeout" "" $store) }}
- name: SILO_AZ_KEY_VAULT_TIMEOUT
  value: {{ . | quote }}
{{- end }}
{{- $secretRef := dig "azKeyVault" "auth" "clientSecretRef" dict $store }}
{{- $secret := dig "azKeyVault" "auth" "clientSecret" "" $store }}
{{- if and $secret (get $secretRef "name") -}}
    {{- fail (printf "set only one of '%s.azKeyVault.auth.clientSecret' and '.clientSecretRef'" $.path) -}}
{{- end -}}
{{- if and (get $secretRef "name") (not (get $secretRef "key")) -}}
    {{- fail (printf "'%s.azKeyVault.auth.clientSecretRef.key' must be defined with '.name'" $.path) -}}
{{- end -}}
{{- if or (get $secretRef "name") $secret }}
- name: SILO_AZ_KEY_VAULT_CLIENT_SECRET
{{- if get $secretRef "name" }}
  valueFrom:
    secretKeyRef:
      name: {{ get $secretRef "name" | quote }}
      key: {{ get $secretRef "key" | quote }}
{{- else }}
  value: {{ $secret | quote }}
{{- end }}
{{- end }}
{{- end }}

{{/*
K8S Secrets Silo namespace to use
*/}}
{{- define "hush-common.kubeSiloNamespace" -}}
{{- if $.store.k8s.namespace -}}
  {{- $.store.k8s.namespace -}}
{{- else -}}
  {{- include "hush-common.namespace" $.root -}}
{{- end -}}
{{- end }}

{{/*
Parse AWS Access Token parameters
*/}}
{{- define "hush-common.awsAccessToken" -}}
{{- $secretAccessKey := dig "secret_access_key" "" . -}}
{{- $accessKeyId := dig "access_key_id" "" . -}}
{{- $sessionToken := dig "session_token" "" . -}}
{{- if and $secretAccessKey $accessKeyId -}}
{{- dict
    "secret_access_key" $secretAccessKey
    "access_key_id" $accessKeyId
    "session_token" $sessionToken
    | toYaml
-}}
{{- end -}}
{{- end }}

{{/*
Secret store AWS access token
*/}}
{{- define "hush-common.siloAwsAccessToken" -}}
{{- with (dig "aws" "access_key" "" $.store) -}}
    {{- include "hush-common.awsAccessToken" . -}}
{{- end -}}
{{- end }}

{{/*
Silo env vars
*/}}
{{- define "hush-common.siloEnvs" -}}
{{- $siloKind := and $.store $.store.kind -}}
{{- if eq $siloKind "awssm" -}}
- name: SILO_KIND
  value: "awssm"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_AWS_SM_REGION
  value: {{ include "hush-common.siloAwsRegion" . | quote }}
    {{- with (dig "aws" "kmsKeyId" "" $.store) }}
- name: SILO_AWS_SM_KMS_KEY_ID
  value: {{ . | quote }}
    {{- end }}
    {{- with (include "hush-common.siloAwsAccessToken" . | fromYaml) }}
- name: AWS_SECRET_ACCESS_KEY
  value: {{ .secret_access_key | quote }}
- name: AWS_ACCESS_KEY_ID
  value: {{ .access_key_id | quote }}
        {{- if .session_token }}
- name: AWS_SESSION_TOKEN
  value: {{ .session_token | quote }}
        {{- end }}
    {{- end }}
{{- else if eq $siloKind "awsssm" -}}
- name: SILO_KIND
  value: "awsssm"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_AWS_SSM_REGION
  value: {{ include "hush-common.siloAwsRegion" . | quote }}
    {{- with (dig "aws" "kmsKeyId" "" $.store) }}
- name: SILO_AWS_SSM_KMS_KEY_ID
  value: {{ . | quote }}
    {{- end }}
    {{- with (include "hush-common.siloAwsAccessToken" . | fromYaml) }}
- name: AWS_SECRET_ACCESS_KEY
  value: {{ .secret_access_key | quote }}
- name: AWS_ACCESS_KEY_ID
  value: {{ .access_key_id | quote }}
        {{- if .session_token }}
- name: AWS_SESSION_TOKEN
  value: {{ .session_token | quote }}
        {{- end }}
    {{- end }}
{{- else if eq $siloKind "gcpsm" -}}
- name: SILO_KIND
  value: "gcpsm"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_GCP_SM_PROJECT
  value: {{ include "hush-common.siloGcpProject" . | quote }}
{{- else if eq $siloKind "kubesecrets" -}}
- name: SILO_KIND
  value: "kubesecrets"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_K8S_NAMESPACE
  value: {{ include "hush-common.kubeSiloNamespace" . | quote }}
{{- else if eq $siloKind "hc_vault" -}}
- name: SILO_KIND
  value: "hc_vault"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_HC_VAULT_ADDRESS
  value: {{ include "hush-common.hcVaultSiloAddress" . | quote }}
    {{- with (include "hush-common.hcVaultSiloMount" .) }}
- name: SILO_HC_VAULT_MOUNT
  value: {{ . | quote }}
    {{- end }}
    {{- with (dig "hcVault" "namespace" "" $.store) }}
- name: SILO_HC_VAULT_ENTERPRISE_NAMESPACE
  value: {{ . | quote }}
    {{- end }}
    {{- $method := include "hush-common.hcVaultSiloAuthMethod" . }}
- name: SILO_HC_VAULT_AUTH_METHOD
  value: {{ $method | quote }}
    {{- if ne $method "token" }}
- name: SILO_HC_VAULT_ROLE
  value: {{ dig "hcVault" "auth" "role" "" $.store | quote }}
        {{- with (dig "hcVault" "auth" "mount" "" $.store) }}
- name: SILO_HC_VAULT_AUTH_MOUNT
  value: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- else if eq $siloKind "az_key_vault" -}}
- name: SILO_KIND
  value: "az_key_vault"
- name: SILO_NAMESPACE_PREFIX
  value: {{ include "hush-common.siloNamespacePrefix" . | quote }}
- name: SILO_AZ_KEY_VAULT_VAULT_URL
  value: {{ include "hush-common.azKeyVaultSiloVaultUrl" . | quote }}
    {{- with (dig "azKeyVault" "cloud" "" $.store) }}
        {{- if not (has . (list "public" "china" "usgov")) }}
            {{- fail (printf "'%s.azKeyVault.cloud' must be one of public, china, usgov, got %q" $.path .) }}
        {{- end }}
- name: SILO_AZ_KEY_VAULT_CLOUD
  value: {{ . | quote }}
    {{- end }}
    {{- $method := include "hush-common.azKeyVaultSiloAuthMethod" . }}
- name: SILO_AZ_KEY_VAULT_AUTH_METHOD
  value: {{ $method | quote }}
- name: SILO_AZ_KEY_VAULT_TENANT_ID
  value: {{ dig "azKeyVault" "auth" "tenantId" "" $.store | quote }}
    {{- if eq $method "client_secret" }}
- name: SILO_AZ_KEY_VAULT_CLIENT_ID
  value: {{ dig "azKeyVault" "auth" "clientId" "" $.store | quote }}
    {{- end }}
{{- else -}}
    {{- fail (printf "invalid secret store kind: %q" $siloKind) -}}
{{- end -}}
{{- include "hush-common.hcVaultSiloProcessEnvs" . }}
{{- include "hush-common.gcpSmSiloProcessEnvs" . }}
{{- include "hush-common.azKeyVaultSiloProcessEnvs" . }}
{{- end }}
