{{- /*
OpenShift SCC assignment via RBAC: bind each component's service account to
the 'system:openshift:scc:<name>' ClusterRole (declarative
'oc adm policy add-scc-to-user'). Rendered only on OpenShift
('security.openshift.io/v1') when 'openshift.createSCCBindings' is set; a
no-op on vanilla Kubernetes.
  sensor DaemonSet        -> privileged (privileged container, hostPID, hostPath)
  sentry/vermon/connector -> anyuid     (run as root; no host access)
*/ -}}
{{- if and .Values.openshift .Values.openshift.createSCCBindings (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
{{- if include "hush-sensor.shouldCreateDaemonSet" . }}
{{ include "hush-common.sccRoleBinding" (dict
    "root" .
    "name" (include "hush-common.fullName" .)
    "scc" "privileged"
    "serviceAccount" (include "hush-common.fullName" .)) }}
{{- end }}
{{- range $component := list "sentry" "vermon" "connector" }}
{{- if (index $.Values $component).enabled }}
{{- $name := include (printf "hush-sensor.%sFullName" $component) $ }}
{{ include "hush-common.sccRoleBinding" (dict
    "root" $
    "name" $name
    "scc" "anyuid"
    "serviceAccount" $name) }}
{{- end }}
{{- end }}
{{- end }}
