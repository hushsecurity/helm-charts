{{- /*
OpenShift SCC assignment via RBAC bind each component's service account to the
'system:openshift:scc:<name>' ClusterRole
(declarative 'oc adm policy add-scc-to-user').
Rendered only on OpenShift ('security.openshift.io/v1') when
'openshift.createSCCBindings' is set; a no-op on vanilla Kubernetes.
  sensor DaemonSet        -> privileged (privileged container, hostPID, hostPath)
  sentry/vermon/connector -> anyuid     (run as root; no host access)
*/ -}}
{{- if and .Values.openshift .Values.openshift.createSCCBindings (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
{{- if include "hush-sensor.shouldCreateDaemonSet" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hush-common.fullName" . }}-scc-privileged
  labels: {{- include "hush-common.labels" . | nindent 4 }}
  namespace: {{ include "hush-common.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "hush-common.fullName" . }}
    namespace: {{ include "hush-common.namespace" . }}
{{- end }}
{{- if .Values.sentry.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hush-sensor.sentryFullName" . }}-scc-anyuid
  labels: {{- include "hush-common.labels" . | nindent 4 }}
  namespace: {{ include "hush-common.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "hush-sensor.sentryFullName" . }}
    namespace: {{ include "hush-common.namespace" . }}
{{- end }}
{{- if .Values.vermon.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hush-sensor.vermonFullName" . }}-scc-anyuid
  labels: {{- include "hush-common.labels" . | nindent 4 }}
  namespace: {{ include "hush-common.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "hush-sensor.vermonFullName" . }}
    namespace: {{ include "hush-common.namespace" . }}
{{- end }}
{{- if .Values.connector.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hush-sensor.connectorFullName" . }}-scc-anyuid
  labels: {{- include "hush-common.labels" . | nindent 4 }}
  namespace: {{ include "hush-common.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "hush-sensor.connectorFullName" . }}
    namespace: {{ include "hush-common.namespace" . }}
{{- end }}
{{- end }}
