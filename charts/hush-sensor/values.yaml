# Default values for hush-sensor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""

# This is to override the chart fullname.
fullnameOverride: ""

# Labels applied to all resources.
# For more information see
# https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
commonLabels: {}

# Host directory for minimal caching
hostDir: "/var/lib/hush-security"

# Override the namespace used for all objects.
# If not specified '.Release.Namespace' is used.
namespaceOverride: ""

# Mode of event logging:
# - "yes"       - log everything (may be high volume)
# - "no"        - log nothing
# - "heartbeat" - log heartbeat events only (low volume)
eventReportingConsole: "heartbeat"

# OpenShift-specific settings. Detected via the 'security.openshift.io/v1' API
# group; a no-op on vanilla Kubernetes.
openshift:
  # Grant each component its required SCC by creating RBAC RoleBindings to the
  # built-in 'system:openshift:scc:<name>' ClusterRoles (the declarative
  # equivalent of 'oc adm policy add-scc-to-user'):
  #   - sensor DaemonSet SA         -> 'privileged'
  #   - sentry/vermon/connector SAs -> 'anyuid'
  # Change the default (set to false) to assign SCCs yourself, e.g. via a
  # separately-reviewed cluster policy, or when the installer is not permitted to
  # grant the referenced SCCs (creating the bindings requires that permission,
  # e.g. cluster-admin/kubeadmin).
  createSCCBindings: true

  # Label the install namespace for the privileged Pod Security Admission level
  # the sensor DaemonSet requires ('enforce'/'warn'/'audit'
  # 'pod-security.kubernetes.io/*=privileged'), via a pre-install/pre-upgrade hook
  # Job (Helm cannot label a namespace it does not own). Create the namespace with
  # 'helm install --create-namespace' so it, and the label, survive uninstall.
  # Change the default (set to false) to label the namespace yourself.
  labelNamespace: true

  # Image the labeling hook Job runs 'oc' (or 'kubectl') from. The default is the
  # CLI image present on every OpenShift cluster, served from the internal
  # registry with no external pull, so it needs no credentials. Change it only for
  # a restricted/air-gapped registry, to any image with a shell and 'oc' or
  # 'kubectl' on its PATH. The Job pulls it using only pre-created secrets listed
  # in 'image.pullSecretList' (the chart-managed pull Secret is not created until
  # after this pre-install hook runs), so for a private registry place a
  # pre-created secret there.
  namespaceLabelImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest

# Hush deployment configuration
hushDeployment:
  # Authentication mode for Hush API token exchange.
  # Allowed values:
  # - password - use deployment password (default)
  # - oidc - use K8S SA token (oidc_provider must be configured in deployment)
  authMode: "password"

  # OIDC authentication settings. Used only when 'hushDeployment.authMode' is "oidc".
  oidc:
    # Audience ('aud' claim) requested for the projected K8S service account
    # token sent as the OIDC assertion. It must match the audience configured in
    # the deployment's oidc_provider.
    #
    # Empty (the default) requests no explicit audience, keeping the cluster
    # default for backward compatibility. On EKS the platform default is
    # "https://kubernetes.default.svc".
    audience: ""

  # The deployment token as received from API/UI.
  # When 'hushDeployment.secretKeyRef.{name,tokenKey}' are defined this value is ignored.
  # Otherwise this value is required.
  token: ""

  # The deployment password as received from API/UI.
  # Only used when 'hushDeployment.authMode' is "password"; ignored when
  # 'hushDeployment.secretKeyRef.{name,key}' are defined.
  # Otherwise this value is required.
  password: ""

  # A reference to an existing Secret with deployment password and token.
  #
  # The secret must be defined in the same namespace where the chart is installed.
  #
  # If deployment token is stored this way updating its value in the Secret
  # must be followed by chart recompilation (helm upgrade/template) or
  # fresh installation (helm install).
  secretKeyRef:
    # Secret name
    name: ""
    # Password secret key
    # Only used when 'hushDeployment.authMode' is "password".
    # If 'hushDeployment.password' is defined this value is ignored.
    key: ""
    # Token secret key
    # If 'hushDeployment.token' is defined this value is ignored.
    tokenKey: ""


# Values related to container images
image:
  # Image pull token contains registry information and credentials
  pullToken: ""

  # Container registry to pull images from
  #
  # This value is ignored when 'image.pullToken' is defined.
  registry: hushsecurity.azurecr.io

  # Overrides the image tag for sensor* images.
  sensorTag: "v0"

  # Overrides the image tag for connector* images.
  connectorTag: "v0"

  # A list of pre-created image pull secrets of the form:
  #
  # pullSecretList:
  #   - name: "<secret-name-here>"
  #
  # Secrets must be pre-created in the same namespace where the chart is installed.
  #
  # When this list is empty 'image.pullSecret' can be used to create a secret
  # automatically.
  #
  # More information can be found here:
  # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecretList: []

  # Creates a Secret for pulling images
  #
  # When 'image.pullToken' is defined the credentials for the Secret are taken
  # from there. Otherwise both 'username' and 'password' must be defined.
  #
  # When 'image.pullSecretList' is non-empty the created secret is not used.
  pullSecret:
    # Custom pull secret name.
    # When not defined chart's full name is used with '-imagepullsecret' suffix.
    name: ""

    # Pull secret username
    #
    # This value is ignored when 'image.pullToken' is defined.
    username: ""

    # Pull secret password
    #
    # This value is ignored when 'image.pullToken' is defined.
    password: ""

  # The pull policy for images.
  pullPolicy: Always

  # The repository used for sensor
  sensorRepository: sensor

  # The repository used for sensor-vector
  sensorVectorRepository: sensor-vector

  # The repository used for sentry
  sentryRepository: sentry

  # The repository used for vermon
  vermonRepository: vermon

  # The repository used for connector-client
  connectorClientRepository: connector-client

  # The repository used for connector-forwarder
  connectorForwarderRepository: connector-forwarder

daemonSet:
  # hush-sensor daemon set
  #   true  = Deploy hush-sensor DaemonSet as part of helm-chart installation
  #   false = Do not deploy hush-sensor DaemonSet.
  #           Useful when specific functionality subset is required.
  enabled: true

  # Disable probing of Java applications
  disableJavaProbing: false

  # Run the sensor container fully privileged.
  #
  # Set to 'false' to run it with the explicit capability set below instead.
  # The seccomp, AppArmor and SELinux profiles stay unconfined either way: the
  # sensor does not run under a confining profile of any of the three.
  #
  # Must be a boolean. A quoted 'false' is refused rather than being treated as
  # 'true', which is what any truthiness test would do with it.
  privilegedMode: true

  # Capabilities added to the sensor container when 'privilegedMode' is
  # 'false', on top of the container runtime's default set.
  capabilities:
    - SYS_ADMIN
    - BPF
    - PERFMON
    - SYS_PTRACE
    - SYS_RESOURCE
    - DAC_READ_SEARCH
    - DAC_OVERRIDE
    - SETUID
    - SETGID

  # Workload sampling parameters.
  #
  # Set to override the defaults (default values specified below):
  #
  # workloadSampling:
  #   amountThreshold: "5"
  #   timeThreshold: "15m" # Go duration format
  #
  # Set both thresholds to zero to disable workload sampling:
  #
  # workloadSampling:
  #   amountThreshold: "0"
  #   timeThreshold: "0s"
  workloadSampling: {}

  # Custom priority class
  priorityClassName: ""

  # Custom node selector
  nodeSelector: {}

  # A custom CRI socket path.
  #
  # This must be the full socket path on the Host.
  # Needed in cases when it cannot be auto-detected.
  criSocketPath: ""

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Termination grace period
  terminationGracePeriodSeconds: 30

  # An update strategy
  updateStrategy:
    type: RollingUpdate

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64
            - key: type
              operator: NotIn
              values:
                - virtual-kubelet
            - key: eks.amazonaws.com/compute-type
              operator: NotIn
              values:
                - fargate

  # A list of tolerations.
  # Match all taints by default.
  # For more information see
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations:
    - operator: "Exists"

  # An additional set of volumes
  extraVolumes: []

  # An additional set of mounts for sensor
  sensorExtraVolumeMounts: []

  # Default resource requests/limits for sensor
  resources:
    limits:
      cpu: "2"
      memory: "1Gi"
    requests:
      cpu: "20m"
      memory: "256Mi"

  # Default resource requests/limits for sensor-vector
  vectorResources:
    limits:
      cpu: "330m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "64Mi"

sensorConfigMap:
  # Configure pod tracing:
  #   false = trace annotated pods only
  #   true  = trace all pods (besides kube-system)
  trace_pods_default: true
  # Report TLS connections
  report_tls: false
  # Akeyless Gateway domain name
  akeyless_gateway_domain: ""

sentry:
  # Hush Security Sentry monitors k8s secrets usage as volumes/envvars in pods
  #    true  = Deploy the Sentry pod as part of the Sensor installation
  #    false = Do not deploy the Sentry pod
  enabled: true

  # Custom priority class
  priorityClassName: ""

  # Custom node selector
  nodeSelector: {}

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Termination grace period
  terminationGracePeriodSeconds: 30

  # An update strategy
  strategy:
    type: RollingUpdate

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64

  # A list of tolerations.
  # For more information see
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # An additional set of volumes
  extraVolumes: []

  # An additional set of mounts for sentry
  sentryExtraVolumeMounts: []

  # Default resource requests/limits for sentry
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "32Mi"

  # Default resource requests/limits for sentry-vector
  vectorResources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "32Mi"

  # Customizations for sentry service account
  serviceAccount:
    # Custom annotations for sentry service account
    annotations: {}

  # Integration for external services
  integrations:
    aws:
      # AWS IAM role ARN to configure with irsa annotations
      # For more information see:
      # https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
      irsa: ""
      # List of optional additional roles to assume
      # assume_roles:
      #   - role_arn: "<arn of the role to assume>"
      #     external_id: "<assume role external id>"
      # If used in EKS with irsa annotation, irsa role should include permissions
      #       to assume listed roles.
      assume_roles: []
    k8s:
      # Enable/disable k8s integration, enabled by default
      enabled: true
      # Enable/disable k8s ESO integration, enabled by default
      # ignored when k8s.enabled is false
      eso_enabled: true
    hc_vault:
      # Hashicorp vault url
      server: ""
      # Hashicorp vault ca cert configuration
      vaultCACert:
        secretKeyRef:
          # Secret name
          name: ""
          # ca crt key
          key: ""
      auth:
        vault_token:
          secretKeyRef:
            # Secret name
            name: ""
            # key that holds the token
            key: ""
        # JWT with K8S as OIDC
        jwt:
          # vault role with token_policies required by crawler
          role: ""
        # k8s sa token
        k8s:
          # vault role with token_policies required by crawler
          role: ""

    azure:
      # Azure tenant ID. Required
      tenant_id: ""

      # Management Group ID.
      # Optional. If set, only subscriptions under management_group_id will
      # be scanned.
      management_group_id: ""

      # List of Azure subscription IDs to crawl.
      # If set, only listed subscriptions will be scanned.
      # If empty, subscriptions are auto-discovered with management_group_id
      # or tenant_id.
      # Only one of management_group_id and subscription_ids can be set.
      # subscription_ids:
      #   - "<subscription-id>"
      subscription_ids: []

      auth:
        # Service principal authentication.
        # Requires tenant_id to be set above.
        service_principal:

          # Azure AD application (client) ID
          client_id: ""

          # Reference to a pre-created K8s Secret containing the client secret.
          # The secret value will be injected as env var AZURE_CLIENT_SECRET.
          clientSecret:
            secretKeyRef:
              # Secret name
              name: ""

              # Key within the secret
              key: ""

        # Azure Workload Identity client ID for default credential auth.
        # When set, the sentry service account is annotated with
        # azure.workload.identity/client-id and the pod is labeled accordingly.
        # Do NOT set both this and service_principal auth.
        workload_identity:
          client_id: ""

vermon:
  # Hush Security Vermon keeps hush sensor channel images up to date.
  # Hush Sensor containers must be deployed with image pull policy "Always"
  # for this feature to perform as expected.
  #    true  = Deploy the Vermon pod as part of the Sensor installation
  #    false = Do not deploy the Vermon pod
  enabled: true

  # How often to check for channel updates, in go time.Duration format
  # Minimum 4 hours, maximum 360 hours (15 days)
  updateFrequency: "8h"

  # Custom priority class
  priorityClassName: ""

  # Custom node selector
  nodeSelector: {}

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Termination grace period
  terminationGracePeriodSeconds: 30

  # An update strategy
  strategy:
    type: RollingUpdate

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64

  # A list of tolerations.
  # For more information see
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # An additional set of volumes
  extraVolumes: []

  # An additional set of mounts for vermon
  vermonExtraVolumeMounts: []

  # Default resource requests/limits for vermon
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "32Mi"

  # Default resource requests/limits for vermon-vector
  vectorResources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "32Mi"


connector:
  # Hush Security Connector allows access to on-premise resources.
  #    true  = Deploy Connector pod as part of Sensor installation
  #    false = Do not deploy the Connector pod
  enabled: true

  # Custom priority class
  priorityClassName: ""

  # Custom node selector
  nodeSelector: {}

  # Additional annotations.
  # For more information see
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # Termination grace period
  terminationGracePeriodSeconds: 30

  # An update strategy
  strategy:
    type: RollingUpdate

  # Node affinity.
  # Choose the node types by OS and Arch.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64

  # A list of tolerations.
  # For more information see
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # An additional set of mounts for connector-client
  clientExtraVolumeMounts: []

  # An additional set of mounts for connector-forwarder
  forwarderExtraVolumeMounts: []

  # Override forwarder timeout
  forwarderTimeout: ""

  # Override max delay for connector-client reconnect attempts
  connectorClientRetryMaxBackoff: ""

  # Default resource requests/limits for connector-client
  clientResources:
    limits:
      cpu: "400m"
      memory: "256Mi"
    requests:
      cpu: "40m"
      memory: "32Mi"

  # Default resource requests/limits for connector-forwarder
  forwarderResources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "40m"
      memory: "32Mi"

  # Default resource requests/limits for connector-vector
  vectorResources:
    limits:
      cpu: "330m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "64Mi"
